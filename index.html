<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NatureBite Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
*{box-sizing:border-box}
:root{
  --green:#164d32;
  --green2:#236b47;
  --light:#f5f3ea;
  --cream:#faf9f4;
  --white:#fff;
  --text:#17251d;
  --muted:#718077;
  --border:#e4e8e3;
  --danger:#c62828;
  --warning:#d98b00;
  --success:#1c7c46;
  --shadow:0 5px 25px rgba(0,0,0,.06)
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text)
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* LOGIN */
#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top right,#dbe8d8,transparent 35%),
    var(--light);
  padding:20px
}
.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  padding:35px;
  border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.1)
}
.logo{
  color:var(--green);
  font-size:30px;
  font-weight:800;
  text-align:center;
  margin-bottom:5px
}
.login-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:28px
}
.form-group{margin-bottom:15px}
.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px
}
input,select,textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  padding:11px 13px;
  border-radius:9px;
  outline:none
}
input:focus,select:focus,textarea:focus{
  border-color:var(--green2)
}
.primary{
  background:var(--green);
  color:white;
  border:0;
  padding:11px 18px;
  border-radius:9px;
  font-weight:bold
}
.primary:hover{background:var(--green2)}
.full{width:100%}
.login-error{
  background:#ffe9e9;
  color:#a51f1f;
  padding:10px;
  border-radius:8px;
  margin-bottom:15px;
  font-size:13px
}

/* APP */
#app{display:none;min-height:100vh}
.sidebar{
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  width:250px;
  background:var(--green);
  color:#fff;
  overflow:auto;
  z-index:20
}
.side-logo{
  padding:25px 22px;
  font-size:25px;
  font-weight:800;
  border-bottom:1px solid rgba(255,255,255,.12)
}
.side-section{
  padding:18px 18px 5px;
  font-size:10px;
  opacity:.55;
  letter-spacing:1.3px;
  font-weight:bold
}
.nav-btn{
  width:100%;
  background:transparent;
  color:#fff;
  border:0;
  text-align:left;
  padding:11px 20px;
  font-size:14px;
  opacity:.88
}
.nav-btn:hover,.nav-btn.active{
  background:rgba(255,255,255,.12);
  opacity:1
}
.main{
  margin-left:250px;
  min-height:100vh
}
.topbar{
  background:#fff;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  border-bottom:1px solid var(--border);
  position:sticky;
  top:0;
  z-index:10
}
.top-title{font-weight:800;font-size:20px}
.user-info{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:13px
}
.role-badge{
  padding:5px 9px;
  border-radius:20px;
  background:#e7f2eb;
  color:var(--green);
  font-weight:bold
}
.logout{
  border:0;
  background:#f6e9e9;
  color:#a52b2b;
  padding:7px 11px;
  border-radius:7px
}
.content{padding:25px}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:14px;
  margin-bottom:25px
}
.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:17px;
  box-shadow:var(--shadow)
}
.card-label{font-size:12px;color:var(--muted)}
.card-value{font-size:25px;font-weight:800;margin-top:8px}
.card-small{font-size:11px;color:var(--muted);margin-top:5px}

/* PAGE */
.page-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:18px
}
.page-head h2{margin:0;font-size:21px}
.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap
}
.btn{
  border:1px solid var(--border);
  background:#fff;
  padding:9px 13px;
  border-radius:8px
}
.btn:hover{background:#f5f7f4}
.btn.green{
  background:var(--green);
  color:#fff;
  border-color:var(--green)
}
.btn.red{
  background:#fff0f0;
  color:#a72222;
  border-color:#ffd1d1
}
.btn.orange{
  background:#fff5dc;
  color:#9a6500;
  border-color:#f2dda9
}
.table-wrap{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  overflow:auto;
  box-shadow:var(--shadow)
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:900px
}
th,td{
  padding:12px;
  border-bottom:1px solid var(--border);
  text-align:left;
  font-size:13px
}
th{
  background:#f8faf7;
  color:#526258;
  font-size:11px;
  text-transform:uppercase
}
.status{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold
}
.status.green{background:#e6f5eb;color:#19723e}
.status.yellow{background:#fff4d8;color:#996700}
.status.red{background:#ffe7e7;color:#a92323}
.status.gray{background:#edf0ee;color:#59645e}

/* DASHBOARD */
.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}
.panel{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
  box-shadow:var(--shadow)
}
.panel h3{margin:0 0 15px;font-size:16px}
.alert{
  padding:11px;
  border-radius:8px;
  margin-bottom:8px;
  background:#f7f9f7;
  font-size:13px
}

/* SETTINGS */
.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}
.setting-box{
  background:#fff;
  border:1px solid var(--border);
  border-radius:13px;
  padding:20px;
  box-shadow:var(--shadow)
}
.setting-box h3{
  margin:0 0 17px;
  color:var(--green)
}
.switch-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:12px 0;
  border-bottom:1px solid #edf0ed
}
.switch{
  width:46px;
  height:24px;
  position:relative
}
.switch input{display:none}
.slider{
  position:absolute;
  inset:0;
  background:#ccc;
  border-radius:20px
}
.slider:before{
  content:"";
  position:absolute;
  width:18px;
  height:18px;
  left:3px;
  top:3px;
  background:#fff;
  border-radius:50%;
  transition:.2s
}
.switch input:checked + .slider{background:var(--green)}
.switch input:checked + .slider:before{
  transform:translateX(22px)
}
.setting-actions{
  margin-top:20px;
  display:flex;
  justify-content:flex-end
}

/* MODAL */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100
}
.modal-box{
  width:100%;
  max-width:850px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  padding:22px
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px
}
.close{
  border:0;
  background:#f1f3f1;
  width:34px;
  height:34px;
  border-radius:50%
}
.detail-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px
}
.detail-item{
  background:#f8faf8;
  padding:10px;
  border-radius:8px
}
.detail-item small{
  display:block;
  color:var(--muted);
  margin-bottom:4px
}

/* PRINT AREA */
#printArea{display:none}

@media(max-width:1200px){
  .cards{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:900px){
  .sidebar{width:210px}
  .main{margin-left:210px}
  .settings-grid,.grid2{grid-template-columns:1fr}
  .cards{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:650px){
  .sidebar{
    position:relative;
    width:100%;
    height:auto
  }
  .main{margin-left:0}
  .topbar{position:relative}
  .content{padding:14px}
  .cards{grid-template-columns:1fr 1fr}
  .detail-grid{grid-template-columns:1fr}
}

/* PRINT */
@media print{
  body>*{display:none!important}
  #printArea{
    display:block!important;
    background:white
  }
  .print-page{
    width:100%;
    min-height:100vh;
    padding:25px;
    page-break-after:always;
    font-family:Arial,sans-serif;
    color:#111
  }
  .print-header{
    display:flex;
    justify-content:space-between;
    border-bottom:2px solid #164d32;
    padding-bottom:10px;
    margin-bottom:15px
  }
  .print-brand{
    font-size:25px;
    font-weight:bold;
    color:#164d32
  }
  .print-table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px
  }
  .print-table th,.print-table td{
    border:1px solid #bbb;
    padding:7px;
    font-size:12px
  }
  .print-flex{
    display:flex;
    justify-content:space-between;
    gap:20px
  }
  .print-qr{text-align:center}
  .print-qr img{max-width:120px}
}
</style>
</head>

<body>

<!-- LOGIN -->

<!-- PRINT -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  getDocs,
  getDoc,
  doc,
  setDoc,
  addDoc,
  updateDoc,
  deleteDoc,
  query,
  orderBy,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* ================================
   FIREBASE CONFIG
================================ */

const firebaseConfig = {
  apiKey: "AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",
  authDomain: "naturebite-c5d88.firebaseapp.com",
  projectId: "naturebite-c5d88",
  storageBucket: "naturebite-c5d88.firebasestorage.app",
  messagingSenderId: "467003957826",
  appId: "1:467003957826:web:483a261d12ac396dca43db"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* ================================
   GLOBAL STATE
================================ */

let currentUser = null;
let currentProfile = null;
let currentPage = "dashboard";

let orders = [];
let products = [];
let variants = [];
let customers = [];
let payments = [];
let refunds = [];
let cancellations = [];
let expenses = [];
let riders = [];
let deliveryPartners = [];
let supportTickets = [];
let reviews = [];
let notifications = [];
let offers = [];
let coupons = [];
let auditLogs = [];

let platformSettings = {
  platformCharge: 5,
  platformChargeType: "fixed",

  standardDelivery: 60,
  expressDelivery: 80,
  freeDelivery: 0,

  freeDeliveryEnabled: false,
  freeDeliveryCampaignName: "",

  deliveryPrepaidRequired: true,

  bkashEnabled: true,
  bkashNumber: "",

  nagadEnabled: true,
  nagadNumber: "",

  codEnabled: true,

  deliveryChargeOnlineEnabled: true,
  fullPaymentOnlineEnabled: true,

  onlinePaymentVerification: true,

  customerServicePhone: "",

  businessName: "NatureBite",
  businessAddress: "",
  businessEmail: "",
  businessPhone: "",

  orderPrefix: "NB"
};


/* ================================
   HELPERS
================================ */

const $ = id => document.getElementById(id);

function escapeHtml(value){
  if(value === null || value === undefined) return "";
  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function money(value){
  return "৳" + Number(value || 0).toLocaleString("en-BD");
}

function normalizeRole(role){
  return String(role || "")
    .trim()
    .toLowerCase()
    .replaceAll(" ","_");
}

function hasPermission(permission){
  if(!currentProfile) return false;

  const role = normalizeRole(currentProfile.role);

  if(role === "super_admin" || role === "superadmin"){
    return true;
  }

  return currentProfile.permissions &&
         currentProfile.permissions[permission] === true;
}

function canChangeSettings(){
  const role = normalizeRole(currentProfile?.role);
  return role === "super_admin" || role === "superadmin";
}

function timestampValue(value){
  if(!value) return 0;

  if(typeof value === "number") return value;

  if(value?.seconds){
    return value.seconds * 1000;
  }

  if(value instanceof Date){
    return value.getTime();
  }

  const parsed = new Date(value).getTime();
  return isNaN(parsed) ? 0 : parsed;
}

function formatDate(value){
  const t = timestampValue(value);
  if(!t) return "-";

  return new Date(t).toLocaleString("en-BD",{
    dateStyle:"medium",
    timeStyle:"short"
  });
}

function statusClass(status){
  const s = String(status || "").toLowerCase();

  if(
    s.includes("deliver") ||
    s.includes("confirm") ||
    s.includes("paid") ||
    s.includes("complete")
  ) return "green";

  if(
    s.includes("pending") ||
    s.includes("packing") ||
    s.includes("new") ||
    s.includes("verification")
  ) return "yellow";

  if(
    s.includes("cancel") ||
    s.includes("refund") ||
    s.includes("reject")
  ) return "red";

  return "gray";
}

function showModal(title,html){
  $("modalTitle").textContent = title;
  $("modalBody").innerHTML = html;
  $("modal").classList.remove("hidden");
}

window.closeModal = function(){
  $("modal").classList.add("hidden");
};

function showPageMessage(message){
  $("content").innerHTML = `
    <div class="panel">
      <h3>${escapeHtml(message)}</h3>
    </div>
  `;
}

async function audit(action,details=""){
  try{
    await addDoc(collection(db,"auditLogs"),{
      action,
      details,
      userUid: currentUser?.uid || "",
      userEmail: currentUser?.email || "",
      createdAt: serverTimestamp()
    });
  }catch(e){
    console.warn("Audit log failed:",e);
  }
}


/* ================================
   LOGIN
================================ */

$("loginForm").addEventListener("submit",async(e)=>{
  e.preventDefault();

  const email = $("loginEmail").value.trim();
  const password = $("loginPassword").value;

  if(!email || !password){
    showLoginError("Email এবং password দিন।");
    return;
  }

  const btn = $("loginBtn");

  btn.disabled = true;
  btn.textContent = "Logging in...";
  $("loginError").classList.add("hidden");

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }catch(error){

    console.error(error);

    let msg = "Login failed.";

    if(error.code === "auth/invalid-credential"){
      msg = "Email অথবা password সঠিক নয়।";
    }
    else if(error.code === "auth/user-not-found"){
      msg = "এই email-এর কোনো account পাওয়া যায়নি।";
    }
    else if(error.code === "auth/wrong-password"){
      msg = "Password সঠিক নয়।";
    }
    else if(error.code === "auth/too-many-requests"){
      msg = "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";
    }

    showLoginError(msg);

  }finally{

    btn.disabled = false;
    btn.textContent = "Login to Admin Panel";

  }
});

function showLoginError(msg){
  $("loginError").textContent = msg;
  $("loginError").classList.remove("hidden");
}


/* ================================
   AUTH STATE
================================ */

onAuthStateChanged(auth,async(user)=>{

  if(!user){

    currentUser = null;
    currentProfile = null;

    $("loginScreen").style.display = "flex";
    $("app").style.display = "none";

    return;
  }

  try{

    const profileRef = doc(db,"users",user.uid);
    const profileSnap = await getDoc(profileRef);

    if(!profileSnap.exists()){

      await signOut(auth);

      showLoginError(
        "এই account-এর Admin profile পাওয়া যায়নি। Firestore users/{UID} profile তৈরি করুন।"
      );

      return;
    }

    const profile = profileSnap.data();

    const role = normalizeRole(profile.role);

    const allowedRoles = [
      "super_admin",
      "superadmin",
      "order_manager",
      "product_manager",
      "inventory_manager",
      "accountant_finance",
      "delivery_manager",
      "customer_support",
      "marketing_manager"
    ];

    if(!allowedRoles.includes(role)){

      await signOut(auth);

      showLoginError(
        "এই account-এর Admin Panel access নেই।"
      );

      return;
    }

    currentUser = user;
    currentProfile = profile;

    $("loginScreen").style.display = "none";
    $("app").style.display = "block";

    $("adminEmail").textContent = user.email || "";
    $("adminRole").textContent =
      String(profile.role || "Staff").replaceAll("_"," ");

    await loadAllData();
    showPage("dashboard");

  }catch(error){

    console.error(error);

    await signOut(auth);

    showLoginError(
      "Admin profile load করা যায়নি। Firestore Rules এবং users profile check করুন।"
    );
  }
});

async function safeGet(collectionName){

  try{

    const snap = await getDocs(
      collection(db,collectionName)
    );

    return snap.docs.map(d=>({
      id:d.id,
      ...d.data()
    }));

  }catch(error){

    console.warn(
      "Cannot load",
      collectionName,
      error.message
    );

    return [];
  }
}


async function loadAllData(){

  orders = await safeGet("orders");
  products = await safeGet("products");
  variants = await safeGet("product_variants");
  customers = await safeGet("users");
  payments = await safeGet("payments");
  refunds = await safeGet("refunds");
  cancellations = await safeGet("cancellations");
  expenses = await safeGet("expenses");
  riders = await safeGet("riders");
  deliveryPartners = await safeGet("deliveryPartners");
  supportTickets = await safeGet("supportTickets");
  reviews = await safeGet("reviews");
  notifications = await safeGet("notifications");
  offers = await safeGet("offers");
  coupons = await safeGet("coupons");
  auditLogs = await safeGet("auditLogs");

  await loadSettings();
}


async function loadSettings(){

  try{

    const snap = await getDoc(
      doc(db,"settings","platform")
    );

    if(snap.exists()){
      platformSettings = {
        ...platformSettings,
        ...snap.data()
      };
    }

  }catch(error){

    console.warn(
      "Settings load failed",
      error
    );

  }
}

function renderDashboard(){

  const totalSales = orders.reduce(
    (sum,o)=>sum + Number(
      o.total ??
      o.grandTotal ??
      0
    ),
    0
  );

  const delivered = orders.filter(o=>
    String(o.orderStatus || o.status || "")
      .toLowerCase()
      .includes("deliver")
  ).length;

  const cancelled = orders.filter(o=>
    String(o.orderStatus || o.status || "")
      .toLowerCase()
      .includes("cancel")
  ).length;

  const pending = orders.length - delivered - cancelled;

  const deliveryIncome = orders.reduce(
    (sum,o)=>sum + Number(o.deliveryCharge || 0),
    0
  );

  const platformIncome = orders.reduce(
    (sum,o)=>sum + Number(o.platformCharge || 0),
    0
  );

  const expenseTotal = expenses.reduce(
    (sum,e)=>sum + Number(
      e.amount || e.total || 0
    ),
    0
  );

  const netProfit =
    totalSales -
    expenseTotal -
    orders.reduce(
      (sum,o)=>sum + Number(
        o.productCost || o.cost || 0
      ),
      0
    );

  const lowStock = variants.filter(v=>
    Number(v.stock || 0) <= Number(v.lowStockLimit || 5)
  ).length;

  $("content").innerHTML = `

    <div class="cards">

      ${statCard("Total Sales",money(totalSales))}
      ${statCard("Total Orders",orders.length)}
      ${statCard("Delivered",delivered)}
      ${statCard("Pending",pending)}
      ${statCard("Cancelled",cancelled)}
      ${statCard("Net Profit",money(netProfit))}
      ${statCard("Low Stock",lowStock)}

    </div>

    <div class="grid2">

      <div class="panel">
        <h3>Recent Orders</h3>

        ${orders
          .slice()
          .sort((a,b)=>
            timestampValue(b.createdAt || b.date) -
            timestampValue(a.createdAt || a.date)
          )
          .slice(0,8)
          .map(o=>`

            <div class="alert">

              <b>${escapeHtml(getOrderCode(o))}</b>
              —
              ${escapeHtml(
                o.customerName ||
                o.name ||
                "Customer"
              )}

              <span style="float:right">
                ${money(o.total || 0)}
              </span>

            </div>

          `).join("") || "No orders."}

      </div>

      <div class="panel">
        <h3>Business Summary</h3>

        <div class="alert">
          Delivery Income:
          <b>${money(deliveryIncome)}</b>
        </div>

        <div class="alert">
          Platform Income:
          <b>${money(platformIncome)}</b>
        </div>

        <div class="alert">
          Expenses:
          <b>${money(expenseTotal)}</b>
        </div>

        <div class="alert">
          Gross Sales:
          <b>${money(totalSales)}</b>
        </div>

      </div>

    </div>

    <br>

    <div class="grid2">

      <div class="panel">
        <h3>Low Stock Alerts</h3>

        ${
          variants
          .filter(v=>
            Number(v.stock || 0) <=
            Number(v.lowStockLimit || 5)
          )
          .slice(0,10)
          .map(v=>`

            <div class="alert">
              ${escapeHtml(v.name || v.title || v.id)}
              —
              <b>${Number(v.stock || 0)} left</b>
            </div>

          `).join("") || "No low stock alerts."
        }

      </div>

      <div class="panel">
        <h3>AI Recommendations</h3>

        <div class="alert">
          ${
            lowStock > 0
            ? "কিছু product-এর stock কমে গেছে। Inventory check করুন।"
            : "বর্তমানে বড় low-stock alert নেই।"

function getOrderCode(o,index=0){

  if(o.orderCode) return o.orderCode;
  if(o.code) return o.code;
  if(o.orderNumber) return o.orderNumber;

  const date = new Date(
    timestampValue(o.createdAt || o.date) || Date.now()
  );

  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");

  return `${platformSettings.orderPrefix || "NB"}-${y}${m}${d}-${String(index+1).padStart(4,"0")}`;
}

function printOrders(list){

  if(!list.length){
    alert("No orders selected.");
    return;
  }

  const sorted = list
    .slice()
    .sort((a,b)=>
      timestampValue(a.createdAt || a.date) -
      timestampValue(b.createdAt || b.date)
    );

  $("printArea").innerHTML = sorted
    .map((o,i)=>buildPrintPage(o,i+1))
    .join("");

  /*
   * Give QR/barcode time to render.
   * Then open ONE browser print dialog.
   */
  setTimeout(()=>{

    sorted.forEach((o,i)=>{

      const code =
        getOrderCode(o);

      const qrElement =
        document.getElementById(
          `qr-${i}`
        );

      if(qrElement){

        new QRCode(qrElement,{
          text:code,
          width:120,
          height:120
        });

      }

      const barcode =
        document.getElementById(
          `barcode-${i}`
        );

      if(barcode){

        try{

          JsBarcode(
            barcode,
            code,
            {
              format:"CODE128",
              displayValue:true,
              width:1.6,
              height:45,
              margin:5
            }
          );

        }catch(e){
          console.warn(e);
        }

      }

    });

    window.print();

  },500);

}

function field(label,id,value,type="text",options=[]){

  let input = "";

  if(type === "textarea"){

    input = `
      <textarea id="${id}" rows="3">
${escapeHtml(value || "")}
      </textarea>
    `;

  }else if(type === "select"){

    input = `
      <select id="${id}">
        ${
          options.map(o=>`
            <option
              value="${escapeHtml(o)}"
              ${String(value)===String(o)?"selected":""}>
              ${escapeHtml(o)}
            </option>
          `).join("")
        }
      </select>
    `;

  }else{

    input = `
      <input
        id="${id}"
        type="${type}"
        value="${escapeHtml(value ?? "")}">
    `;

  }

  return `
    <div class="form-group">
      <label>${escapeHtml(label)}</label>
      ${input}
    </div>
  `;
}


function toggle(id,checked){

  return `
    <label class="switch">
      <input
        id="${id}"
        type="checkbox"
        ${checked ? "checked" : ""}>
      <span class="slider"></span>
    </label>
  `;
}


async function saveSettings(){

  const newSettings = {

    ...platformSettings,

    bkashNumber:
      $("setBkash").value.trim(),

    bkashEnabled:
      $("setBkashEnabled").checked,

    nagadNumber:
      $("setNagad").value.trim(),

    nagadEnabled:
      $("setNagadEnabled").checked,

    codEnabled:
      $("setCod").checked,

    deliveryChargeOnlineEnabled:
      $("setDeliveryOnline").checked,

    fullPaymentOnlineEnabled:
      $("setFullOnline").checked,

    onlinePaymentVerification:
      $("setPaymentVerification").checked,

    standardDelivery:
      Number($("setStandardDelivery").value || 0),

    expressDelivery:
      Number($("setExpressDelivery").value || 0),

    freeDelivery:
      Number($("setFreeDelivery").value || 0),

    freeDeliveryEnabled:
      $("setFreeDeliveryEnabled").checked,

    freeDeliveryCampaignName:
      $("setFreeCampaign").value.trim(),

    deliveryPrepaidRequired:
      $("setDeliveryPrepaid").checked,

    platformCharge:
      Number($("setPlatformCharge").value || 0),

    platformChargeType:
      $("setPlatformType").value,

    orderPrefix:
      $("setOrderPrefix").value.trim() || "NB",

    customerServicePhone:
      $("setCustomerPhone").value.trim(),

    businessName:
      $("setBusinessName").value.trim(),

    businessPhone:
      $("setBusinessPhone").value.trim(),

    businessEmail:
      $("setBusinessEmail").value.trim(),

    businessAddress:
      $("setBusinessAddress").value.trim(),

    updatedAt:
      serverTimestamp(),

    updatedBy:
      currentUser.uid

  };


  try{

    await setDoc(
      doc(db,"settings","platform"),
      newSettings,
      {merge:true}
    );

    platformSettings = {
      ...platformSettings,
      ...newSettings
    };

    await audit(
      "Platform Settings Updated",
      "Payment, delivery and business settings changed."
    );

    alert("Settings successfully saved.");

  }catch(error){

    console.error(error);

    alert(
      "Settings save failed: " +
      error.message
    );

  }

}

function generateReport(){

  const from =
    $("reportFrom").value
    ? new Date(
        $("reportFrom").value +
        "T00:00:00"
      ).getTime()
    : 0;

  const to =
    $("reportTo").value
    ? new Date(
        $("reportTo").value +
        "T23:59:59"
      ).getTime()
    : Date.now();

  const filtered =
    orders.filter(o=>{

      const time =
        timestampValue(
          o.createdAt ||
          o.date
        );

      return time >= from &&
             time <= to;

    });

  const sales =
    filtered.reduce(
      (s,o)=>s + Number(
        o.total ||
        o.grandTotal ||
        0
      ),0
    );

  const delivery =
    filtered.reduce(
      (s,o)=>s + Number(
        o.deliveryCharge || 0
      ),0
    );

  const platform =
    filtered.reduce(
      (s,o)=>s + Number(
        o.platformCharge || 0
      ),0
    );

  const cancelled =
    filtered.filter(o=>
      String(
        o.status ||
        o.orderStatus ||
        ""
      ).toLowerCase()
      .includes("cancel")
    ).length;

  const delivered =
    filtered.filter(o=>
      String(
        o.status ||
        o.orderStatus ||
        ""
      ).toLowerCase()
      .includes("deliver")
    ).length;

  $("reportResult").innerHTML = `

    <div class="cards">

      ${statCard(
        "Orders",
        filtered.length
      )}

      ${statCard(
        "Sales",
        money(sales)
      )}

      ${statCard(
        "Delivered",
        delivered
      )}

      ${statCard(
        "Cancelled",
        cancelled
      )}

      ${statCard(
        "Delivery Income",
        money(delivery)
      )}

      ${statCard(
        "Platform Income",
        money(platform)
      )}

    </div>

  `;

}
