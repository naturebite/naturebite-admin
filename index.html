<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NatureBite Admin Panel</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7f1;
  color:#24352a
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

:root{
 --green:#267337;
 --dark:#174f2b;
 --light:#eef5e9;
 --cream:#f5f7f1;
 --border:#e2e7dd;
 --red:#c73535;
 --orange:#c47b20;
 --blue:#315bb8;
}

#loginScreen{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:linear-gradient(135deg,#174f2b,#3b8b47)
}

.login-box{
 width:100%;
 max-width:430px;
 background:#fff;
 border-radius:22px;
 padding:38px;
 box-shadow:0 25px 70px rgba(0,0,0,.25)
}

.brand{text-align:center;margin-bottom:28px}
.logo{
 width:64px;height:64px;
 margin:auto;
 border-radius:18px;
 background:var(--green);
 color:#fff;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:28px;
 font-weight:800
}
.brand h1{margin-top:12px;color:var(--dark)}
.brand p{color:#777;margin-top:5px;font-size:13px}

.form-group{margin-bottom:14px}
.form-group label{
 display:block;
 margin-bottom:6px;
 font-size:12px;
 font-weight:bold
}

input,select,textarea{
 width:100%;
 padding:11px 12px;
 border:1px solid #ddd;
 border-radius:9px;
 outline:none;
 background:#fff
}
input:focus,select:focus,textarea:focus{
 border-color:var(--green);
 box-shadow:0 0 0 3px rgba(38,115,55,.08)
}

.login-btn,.primary{
 width:100%;
 border:0;
 border-radius:9px;
 padding:13px;
 background:var(--green);
 color:#fff;
 font-weight:bold
}
.login-btn:disabled{opacity:.6}

.login-message{
 display:none;
 margin-top:13px;
 padding:11px;
 border-radius:9px;
 font-size:12px
}
.login-message.error{
 display:block;
 background:#fff0f0;
 color:#a52b2b
}
.login-message.success{
 display:block;
 background:#edf8ed;
 color:#267337
}

.forgot{
 text-align:center;
 margin-top:15px
}
.forgot button{
 border:0;
 background:none;
 color:var(--green);
 font-size:12px
}

/* APP */
#adminApp{display:none;min-height:100vh}

.sidebar{
 position:fixed;
 left:0;top:0;bottom:0;
 width:245px;
 background:var(--dark);
 color:#fff;
 padding:18px 13px;
 overflow:auto;
 z-index:50
}

.sidebar-brand{
 display:flex;
 align-items:center;
 gap:10px;
 padding:8px 10px 22px
}
.sidebar-logo{
 width:38px;height:38px;
 border-radius:11px;
 background:#fff;
 color:var(--green);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800
}

.section-title{
 font-size:9px;
 opacity:.55;
 margin:16px 10px 7px;
 text-transform:uppercase;
 letter-spacing:.6px
}

.nav-item{
 width:100%;
 border:0;
 background:transparent;
 color:#fff;
 padding:10px 11px;
 border-radius:8px;
 text-align:left;
 font-size:12px;
 margin-bottom:2px
}
.nav-item:hover,
.nav-item.active{
 background:rgba(255,255,255,.14)
}

.logout-btn{
 margin-top:20px;
 width:100%;
 padding:10px;
 border:1px solid rgba(255,255,255,.2);
 background:rgba(0,0,0,.12);
 color:#fff;
 border-radius:8px
}

.main{margin-left:245px;min-height:100vh}

.topbar{
 height:68px;
 background:#fff;
 border-bottom:1px solid var(--border);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 24px;
 position:sticky;
 top:0;
 z-index:40
}

.search{width:330px}
.search input{
 background:#f2f4ed;
 border:0;
 border-radius:20px
}

.top-actions{
 display:flex;
 align-items:center;
 gap:14px
}

.notification{
 width:38px;height:38px;
 border:0;
 border-radius:50%;
 background:#f2f4ed
}

.profile{
 display:flex;
 align-items:center;
 gap:9px
}

.avatar{
 width:38px;height:38px;
 border-radius:50%;
 background:#dcebdc;
 color:var(--green);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:bold
}

.profile-info{font-size:11px}
.profile-info strong{display:block}
.profile-info span{color:#777}

.mobile-menu{
 display:none;
 border:0;
 background:#f2f4ed;
 padding:8px;
 border-radius:8px
}

.content{padding:25px}

.page-title{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:15px;
 margin-bottom:20px
}

.page-title h2{
 color:var(--green);
 font-size:24px
}
.page-title p{
 color:#888;
 font-size:11px;
 margin-top:4px
}

.toolbar{
 display:flex;
 gap:8px;
 flex-wrap:wrap;
 margin-bottom:15px
}

.btn{
 border:1px solid #dce1d8;
 background:#fff;
 color:#31533a;
 padding:9px 12px;
 border-radius:8px;
 font-size:11px
}
.btn.primary{
 background:var(--green);
 color:#fff;
 border-color:var(--green);
 width:auto
}
.btn.danger{
 background:#fff0f0;
 color:var(--red);
 border-color:#ffd1d1
}
.btn.small{
 padding:6px 8px;
 font-size:10px
}

.stats{
 display:grid;
 grid-template-columns:repeat(7,minmax(120px,1fr));
 gap:12px
}

.stat-card{
 background:#fff;
 border:1px solid var(--border);
 border-radius:13px;
 padding:15px;
 min-height:105px
}

.stat-card small{
 color:#888;
 font-size:9px;
 text-transform:uppercase
}
.stat-card h3{
 margin-top:10px;
 font-size:20px
}
.stat-card.green h3{color:var(--green)}
.stat-card.red h3{color:var(--red)}
.stat-card.orange h3{color:var(--orange)}
.stat-card.blue h3{color:var(--blue)}

.dashboard-grid{
 display:grid;
 grid-template-columns:minmax(0,2fr) minmax(280px,1fr);
 gap:18px;
 margin-top:20px
}

.panel{
 background:#fff;
 border:1px solid var(--border);
 border-radius:14px;
 padding:18px;
 margin-bottom:18px
}

.panel-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 margin-bottom:15px
}
.panel-header h3{font-size:15px}

.table-wrap{overflow:auto}

table{
 width:100%;
 border-collapse:collapse;
 min-width:650px
}

th{
 text-align:left;
 color:#999;
 font-size:9px;
 text-transform:uppercase;
 padding:9px;
 border-bottom:1px solid #eee
}
td{
 padding:10px 9px;
 border-bottom:1px solid #f0f1ec;
 font-size:11px
}

.status{
 display:inline-block;
 padding:5px 7px;
 border-radius:8px;
 font-size:8px;
 font-weight:bold
}
.status.green{background:#eaf8ed;color:#287536}
.status.orange{background:#fff5dc;color:#a76b00}
.status.red{background:#ffeded;color:#b63232}
.status.blue{background:#eaf1fb;color:#315bb8}
.status.gray{background:#eee;color:#666}

.alert{
 padding:12px;
 border-radius:9px;
 background:#f7f8f2;
 margin-bottom:9px;
 font-size:11px
}
.alert strong{
 display:block;
 margin-bottom:4px
}
.alert.green{border-left:4px solid var(--green)}
.alert.orange{border-left:4px solid var(--orange)}
.alert.red{border-left:4px solid var(--red)}

.empty,.loading{
 padding:30px;
 text-align:center;
 color:#888;
 font-size:12px
}

.form-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px
}
.full{grid-column:1/-1}

.checkbox{
 display:flex;
 align-items:center;
 gap:8px
}
.checkbox input{width:auto}

.kpi-row{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
 margin-bottom:15px
}
.mini-card{
 background:#f7f8f2;
 border:1px solid var(--border);
 border-radius:10px;
 padding:12px
}
.mini-card small{
 color:#888;
 display:block
}
.mini-card b{
 display:block;
 margin-top:5px;
 font-size:18px
}

.modal-backdrop{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 display:none;
 align-items:center;
 justify-content:center;
 padding:20px;
 z-index:100
}
.modal{
 width:100%;
 max-width:780px;
 max-height:90vh;
 overflow:auto;
 background:#fff;
 border-radius:16px;
 padding:20px
}
.modal-header{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:18px
}
.modal-close{
 width:32px;height:32px;
 border:0;
 border-radius:50%;
 background:#f0f2eb
}
.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:18px
}

.toast{
 position:fixed;
 right:20px;
 bottom:20px;
 background:#24352a;
 color:#fff;
 padding:12px 15px;
 border-radius:9px;
 display:none;
 z-index:200;
 max-width:350px;
 font-size:12px
}

.bad{color:var(--red)}
.muted{color:#888;font-size:11px}

.grid3{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px
}

.switch{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:13px;
 background:#f7f8f2;
 border:1px solid var(--border);
 border-radius:10px
}

.switch input{width:auto}

@media(max-width:1100px){
 .stats{grid-template-columns:repeat(3,1fr)}
 .dashboard-grid{grid-template-columns:1fr}
}

@media(max-width:800px){
 .sidebar{
  transform:translateX(-100%);
  transition:.2s
 }
 .sidebar.open{transform:translateX(0)}
 .main{margin-left:0}
 .mobile-menu{display:block}
 .topbar{padding:0 12px}
 .search{width:180px}
 .form-grid{grid-template-columns:1fr}
 .full{grid-column:auto}
 .grid3{grid-template-columns:1fr}
}

@media(max-width:600px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .content{padding:14px}
 .search{width:140px}
 .profile-info{display:none}
 .page-title{
  flex-direction:column;
  align-items:flex-start
 }
 .kpi-row{grid-template-columns:1fr 1fr}
}
</style>
</head>

<script type="module">

import {
 initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
 getAuth,
 signInWithEmailAndPassword,
 onAuthStateChanged,
 signOut,
 sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
 getFirestore,
 collection,
 getDocs,
 getDoc,
 doc,
 setDoc,
 addDoc,
 updateDoc,
 deleteDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


/* =========================================================
 FIREBASE
========================================================= */

const firebaseConfig={
 apiKey:"AIzaSyCBaUWZflbj0RVfdyl1vZCB3SYD42vkI_0",
 authDomain:"naturebite-c5d88.firebaseapp.com",
 projectId:"naturebite-c5d88",
 storageBucket:"naturebite-c5d88.firebasestorage.app",
 messagingSenderId:"467003957826",
 appId:"1:467003957826:web:483a261d12ac396dca43db"
};

const app=initializeApp(firebaseConfig);

const auth=getAuth(app);
const db=getFirestore(app);


/* =========================================================
 GLOBAL
========================================================= */

const $=id=>document.getElementById(id);

let currentUser=null;
let currentAdmin=null;
let currentPage="dashboard";
let currentRows=[];
let currentCollection="";


/* =========================================================
 HELPERS
========================================================= */

function safe(v){
 return v===undefined||v===null?"":String(v);
}

function money(v){
 return "৳"+(Number(v)||0).toLocaleString("en-BD",{
  maximumFractionDigits:2
 });
}

function toast(text){
 $("toast").textContent=text;
 $("toast").style.display="block";

 clearTimeout(window.__toastTimer);

 window.__toastTimer=setTimeout(()=>{
  $("toast").style.display="none";
 },3000);
}

function loginMessage(text,type="error"){
 $("loginMessage").textContent=text;
 $("loginMessage").className="login-message "+type;
}

function fmtDate(v){
 if(!v)return"-";

 try{
  if(v.toDate)
   return v.toDate().toLocaleString("en-BD");

  return new Date(v).toLocaleString("en-BD");
 }catch{
  return"-";
 }
}

function roleLabel(role){

 const r=String(role||"")
 .toLowerCase()
 .replace(/\s+/g,"_");

 const map={
  super_admin:"Super Admin",
  order_manager:"Order Manager",
  product_manager:"Product Manager",
  inventory_manager:"Inventory Manager",
  finance:"Accountant / Finance",
  accountant_finance:"Accountant / Finance",
  delivery_manager:"Delivery Manager",
  customer_support:"Customer Support",
  marketing_manager:"Marketing Manager"
 };

 return map[r]||role||"Staff";
}

function isSuperAdmin(){

 return currentAdmin?.isSuperAdmin===true ||
 String(currentAdmin?.role||"")
 .toLowerCase()
 .replace(/\s+/g,"_")==="super_admin";
}

function can(permission){

 return isSuperAdmin() ||
 currentAdmin?.permissions?.[permission]===true;
}

function noAccess(){

 $("content").innerHTML=`
 <div class="panel">
  <div class="empty">
   আপনার এই module ব্যবহারের permission নেই।
  </div>
 </div>`;
}

function pageHead(title,subtitle,buttons=""){

 return `
 <div class="page-title">
  <div>
   <h2>${title}</h2>
   <p>${subtitle}</p>
  </div>

  <div class="toolbar">
   ${buttons}
  </div>
 </div>`;
}

function statusBadge(value){

 let s=String(value||"")
 .toLowerCase();

 let cls="gray";

 if(
  s.includes("deliver")||
  s.includes("verified")||
  s==="active"||
  s==="paid"
 )cls="green";

 else if(
  s.includes("pending")||
  s.includes("processing")||
  s.includes("waiting")
 )cls="orange";

 else if(
  s.includes("cancel")||
  s.includes("reject")||
  s.includes("failed")||
  s.includes("refund")
 )cls="red";

 else if(
  s.includes("out")||
  s.includes("assigned")
 )cls="blue";

 return `<span class="status ${cls}">
 ${safe(value||"-")}
 </span>`;
}


/* =========================================================
 FIRESTORE
========================================================= */

async function getRows(name){

 const snap=await getDocs(collection(db,name));

 return snap.docs.map(d=>({
  id:d.id,
  ...d.data()
 }));
}


/* =========================================================
 AUDIT
========================================================= */

async function audit(action,module,recordId,data={}){

 try{

  await addDoc(
   collection(db,"audit_logs"),
   {
    actorUid:currentUser?.uid||"",
    actorEmail:currentUser?.email||"",
    action,
    module,
    recordId,
    changes:data,
    createdAt:serverTimestamp()
   }
  );

 }catch(e){
  console.warn("Audit failed",e);
 }
}


/* =========================================================
 LOGIN
========================================================= */

$("loginForm").onsubmit=async e=>{

 e.preventDefault();

 const email=$("email").value.trim();
 const password=$("password").value;

 if(!email||!password){
  loginMessage("Email এবং Password দিন।");
  return;
 }

 $("loginBtn").disabled=true;
 $("loginBtn").textContent="Signing in...";

 try{

  await signInWithEmailAndPassword(
   auth,
   email,
   password
  );

 }catch(e){

  console.error(e);

  const messages={
   "auth/invalid-credential":
    "Email অথবা Password সঠিক নয়।",

   "auth/user-not-found":
    "এই Email দিয়ে account পাওয়া যায়নি।",

   "auth/wrong-password":
    "Password সঠিক নয়।",

   "auth/invalid-email":
    "Email address সঠিক নয়।",

   "auth/too-many-requests":
    "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।",

   "auth/network-request-failed":
    "Internet connection সমস্যা হয়েছে।"
  };

  loginMessage(
   messages[e.code]||
   ("Firebase Error: "+(e.code||e.message))
  );

 }finally{

  $("loginBtn").disabled=false;
  $("loginBtn").textContent="Sign In";

 }
};


/* =========================================================
 FORGOT PASSWORD
========================================================= */

$("forgotBtn").onclick=async()=>{

 const email=$("email").value.trim();

 if(!email){
  loginMessage("প্রথমে Email লিখুন।");
  return;
 }

 try{

  await sendPasswordResetEmail(auth,email);

  loginMessage(
   "Password reset email পাঠানো হয়েছে।",
   "success"
  );

 }catch(e){

  loginMessage(
   e.code==="auth/user-not-found"
   ?"এই Email দিয়ে account পাওয়া যায়নি।"
   :"Password reset email পাঠানো যায়নি।"
  );

 }
};


/* =========================================================
 AUTH STATE
========================================================= */

onAuthStateChanged(auth,async user=>{

 if(!user){

  currentUser=null;
  currentAdmin=null;

  $("loginScreen").style.display="flex";
  $("adminApp").style.display="none";

  return;
 }

 currentUser=user;

 try{

  /*
   Admin/Staff profile:
   staff/{AUTH UID}
  */

  let snap=await getDoc(
   doc(db,"staff",user.uid)
  );

  let profile=null;

  if(snap.exists()){

   profile=snap.data();

  }else{

   /*
    Compatibility:
    পুরোনো setup-এ users/{uid}
  */

   const old=await getDoc(
    doc(db,"users",user.uid)
   );

   if(old.exists())
    profile=old.data();
  }


  if(!profile){

   await signOut(auth);

   $("loginHelp").style.display="block";

   $("loginHelp").innerHTML=`
    <b>Login সফল হয়েছে কিন্তু Staff profile পাওয়া যায়নি।</b>
    <br><br>
    Firebase UID:
    <code>${safe(user.uid)}</code>
    <br><br>
    Firestore → staff →
    Document ID হিসেবে এই UID ব্যবহার করুন।
   `;

   loginMessage(
    "Staff profile পাওয়া যায়নি।"
   );

   return;
  }


  if(
   profile.status &&
   String(profile.status).toLowerCase()!=="active"
  ){

   await signOut(auth);

   loginMessage(
    "এই Staff account বর্তমানে Active নয়।"
   );

   return;
  }


  currentAdmin={
   uid:user.uid,
   email:user.email,
   name:profile.name||profile.displayName||"Admin",
   role:profile.role||"Staff",
   permissions:profile.permissions||{},
   isSuperAdmin:
    String(profile.role||"")
    .toLowerCase()
    .replace(/\s+/g,"_")==="super_admin"
    ||
    profile.isSuperAdmin===true
  };


  $("loginScreen").style.display="none";
  $("adminApp").style.display="block";

  $("adminName").textContent=currentAdmin.name;
  $("adminRole").textContent=roleLabel(currentAdmin.role);
  $("avatar").textContent=
   currentAdmin.name.charAt(0).toUpperCase();

  applyPermissions();

  await loadPage("dashboard");

 }catch(e){

  console.error(e);

  await signOut(auth);

  loginMessage(
   "Admin profile load করতে সমস্যা হয়েছে: "+e.message
  );
 }

});


/* =========================================================
 PERMISSIONS
========================================================= */

function applyPermissions(){

 document
 .querySelectorAll(".nav-item[data-perm]")
 .forEach(button=>{

  const p=button.dataset.perm;

  button.style.display=
   can(p)?"":"none";

 });
}


/* =========================================================
 NAVIGATION
========================================================= */

document
.querySelectorAll(".nav-item")
.forEach(button=>{

 button.onclick=()=>{

  loadPage(button.dataset.page);

  $("sidebar").classList.remove("open");
 };

});


async function loadPage(page){

 currentPage=page;

 document
 .querySelectorAll(".nav-item")
 .forEach(x=>{
  x.classList.toggle(
   "active",
   x.dataset.page===page
  );
 });

 const pages={
  dashboard,
  orders,
  products,
  inventory,
  customers,
  riders,
  deliveryPartners,
  payments,
  refunds,
  cancellations,
  expenses,
  reports,
  offers,
  luckyWheel,
  luckyDraw,
  reviews,
  banners,
  support,
  notifications,
  staff,
  permissionsPage,
  aiAssistant,
  settings,
  auditLogs
 };

 if(pages[page])
  await pages[page]();
}

function showModal(title,html){

 $("modalTitle").textContent=title;
 $("modalBody").innerHTML=html;
 $("modalBackdrop").style.display="flex";
}

function closeModal(){

 $("modalBackdrop").style.display="none";
}

$("modalClose").onclick=closeModal;

$("modalBackdrop").onclick=e=>{
 if(e.target===$("modalBackdrop"))
  closeModal();
};

async function dashboard(){

 pageHead(
  "Dashboard",

   ↻ Refresh
  </button>`
 )+
 `
 <div class="stats" id="dashboardStats">
  <div class="loading">Loading...</div>
 </div>

 <div class="dashboard-grid">

  <div class="panel">
   <div class="panel-header">
    <h3>Recent Orders</h3>
    <button class="btn small" id="viewOrders">
     View All
    </button>
   </div>

   <div id="recentOrders"></div>
  </div>

  <div class="panel">

   <div class="panel-header">
    <h3>Alerts</h3>
   </div>

   <div id="dashboardAlerts">
    <div class="loading">Loading...</div>
   </div>

  </div>

 </div>
 `;

 $("refreshDashboard").onclick=dashboard;
 $("viewOrders").onclick=()=>loadPage("orders");


 try{

  const ordersData=
   can("orders")?await getRows("orders"):[];

  const variants=
   can("inventory")
   ?await getRows("product_variants")
   :[];

  const expenses=
   can("expenses")
   ?await getRows("expenses")
   :[];

  const payments=
   can("payments")
   ?await getRows("payments")
   :[];

  const sales=
   ordersData.reduce(
    (sum,o)=>sum+
    Number(o.total||o.orderTotal||0),
    0
   );

  const expenseTotal=
   expenses.reduce(
    (sum,x)=>sum+Number(x.amount||0),
    0
   );

  const delivered=
   ordersData.filter(o=>
    String(o.status||"")
    .toLowerCase()
    .includes("deliver")
   ).length;

  const pending=
   ordersData.filter(o=>
    [
     "pending",
     "confirmed",
     "processing",
     "out for delivery"
    ].includes(
     String(o.status||"").toLowerCase()
    )
   ).length;

  const cancelled=
   ordersData.filter(o=>
    String(o.status||"")
    .toLowerCase()
    .includes("cancel")
   ).length;

  const lowStock=
   variants.filter(v=>
    Number(v.stock||0)<=10
   ).length;

  const pendingPayments=
   payments.filter(p=>
    String(p.status||"")
    .toLowerCase()==="pending"
   ).length;


  $("dashboardStats").innerHTML=`

   <div class="stat-card green">
    <small>Total Sales</small>
    <h3>${money(sales)}</h3>
   </div>

   <div class="stat-card blue">
    <small>Total Orders</small>
    <h3>${ordersData.length}</h3>
   </div>

   <div class="stat-card green">
    <small>Delivered</small>
    <h3>${delivered}</h3>
   </div>

   <div class="stat-card orange">
    <small>Pending</small>
    <h3>${pending}</h3>
   </div>

   <div class="stat-card red">
    <small>Cancelled</small>
    <h3>${cancelled}</h3>
   </div>

   <div class="stat-card green">
    <small>Net Recorded</small>
    <h3>${money(sales-expenseTotal)}</h3>
   </div>

   <div class="stat-card red">
    <small>Low Stock</small>
    <h3>${lowStock}</h3>
   </div>
  `;


  const recent=
   ordersData
   .sort((a,b)=>{
    const ad=a.createdAt?.seconds||0;
    const bd=b.createdAt?.seconds||0;
    return bd-ad;
   })
   .slice(0,10);


  $("recentOrders").innerHTML=
   recent.length
   ?
   `<div class="table-wrap">
    <table>
     <thead>
      <tr>
       <th>Order</th>
       <th>Customer</th>
       <th>Total</th>
       <th>Payment</th>
       <th>Status</th>
      </tr>
     </thead>
     <tbody>

      ${recent.map(o=>`

       <tr>

        <td>
         <b>${safe(o.orderId||o.id)}</b>
        </td>

        <td>
         ${safe(o.customerName||o.customerUid)}
        </td>

        <td>
         ${money(o.total)}
        </td>

        <td>
         ${statusBadge(
          o.paymentStatus||
          o.paymentMethod||
          "-"
         )}
        </td>

        <td>
         ${statusBadge(o.status||"Pending")}
        </td>

       </tr>

      `).join("")}

     </tbody>
    </table>
   </div>`
   :
   `<div class="empty">
     No orders found.
    </div>`;


  $("dashboardAlerts").innerHTML=`

   <div class="alert ${lowStock?"red":"green"}">

    <strong>Inventory</strong>

    ${
     lowStock
     ?lowStock+" variant(s) low stock."
     :"No low-stock variant."
    }

   </div>


   <div class="alert ${pendingPayments?"orange":"green"}">

    <strong>Payment Verification</strong>

    ${
     pendingPayments
     ?pendingPayments+" payment(s) waiting for verification."
     :"No pending payment verification."
    }

   </div>


   <div class="alert green">

    <strong>Expenses</strong>

    Recorded expenses:
    ${money(expenseTotal)}

   </div>
  `;


 }catch(e){

  $("dashboardStats").innerHTML=`
   <div class="panel">
    <div class="empty">
     Dashboard load failed.
     <br>
     ${safe(e.message)}
    </div>
   </div>
  `;

 }

}

/* =========================================================
 ORDER STATUS
========================================================= */

function orderStatusForm(o){

 showModal(
  "Update Order Status",
  `

  <div class="form-group">

   <label>Order Status</label>

   <select id="newOrderStatus">

    <option value="pending">Pending</option>
    <option value="confirmed">Confirmed</option>
    <option value="processing">Processing</option>
    <option value="out for delivery">
     Out for Delivery
    </option>
    <option value="delivered">Delivered</option>
    <option value="cancelled">Cancelled</option>

   </select>

  </div>


  <div class="form-group">

   <label>Admin Note</label>

   <textarea
    id="orderAdminNote"
    rows="3"
    placeholder="Optional note">
   </textarea>

  </div>


  <div class="modal-actions">

   <button class="btn"
    id="cancelStatus">
    Cancel
   </button>

   <button class="btn primary"
    id="saveStatus">
    Save
   </button>

  </div>
  `
 );

 $("newOrderStatus").value=
  o.status||"pending";

 $("cancelStatus").onclick=closeModal;

 $("saveStatus").onclick=async()=>{

  try{

   const status=
    $("newOrderStatus").value;

   await updateDoc(
    doc(db,"orders",o.id),
    {
     status,
     adminNote:
      $("orderAdminNote").value.trim(),
     updatedAt:serverTimestamp()
    }
   );

   await audit(
    "order_status_update",
    "orders",
    o.id,
    {status}
   );

   closeModal();
   toast("Order status updated.");
   orders();

  }catch(e){

   toast("Update failed: "+e.message);

  }

 };

}


/* =========================================================
 RIDER ASSIGN
========================================================= */

async function assignRider(o){

 let riders=[];

 try{
  riders=await getRows("riders");
 }catch(e){}

 showModal(
  "Assign Rider",
  `

  <div class="form-group">

   <label>Rider</label>

   <select id="riderSelect">

    <option value="">
     Unassigned
    </option>

    ${riders.map(r=>`

     <option value="${r.id}">
      ${safe(r.name)}
      -
      ${safe(r.mobile||r.phone)}
     </option>

    `).join("")}

   </select>

  </div>


  <div class="modal-actions">

   <button class="btn"
    id="cancelRider">
    Cancel
   </button>

   <button class="btn primary"
    id="saveRider">
    Assign
   </button>

  </div>
  `
 );

 $("riderSelect").value=
  o.riderId||"";

 $("cancelRider").onclick=closeModal;

 $("saveRider").onclick=async()=>{

  const riderId=
   $("riderSelect").value;

  const rider=
   riders.find(r=>r.id===riderId);

  try{

   await updateDoc(
    doc(db,"orders",o.id),
    {
     riderId:riderId||null,
     riderName:rider?.name||null,
     updatedAt:serverTimestamp()
    }
   );

   await audit(
    "rider_assign",
    "orders",
    o.id,
    {
     riderId:riderId||null
    }
   );

   closeModal();
   toast("Rider assigned.");
   orders();

  }catch(e){

   toast("Rider assignment failed: "+e.message);

  }

 };

}

function genericModal(
 title,
 collectionName,
 fields,
 row=null
){

 const html=`

 <div class="form-grid">

 ${fields.map(f=>{

  const key=f[0];
  const label=f[1];
  const type=f[2];

  if(type==="textarea"){

   return`
   <div class="form-group full">
    <label>${label}</label>
    <textarea
     id="gf_${key}"
     rows="3">${safe(row?.[key])}</textarea>
   </div>`;
  }

  if(type==="select"){

   const options=
    String(f[3]||"")
    .split("|");

   return`
   <div class="form-group">
    <label>${label}</label>
    <select id="gf_${key}">
     ${options.map(x=>
      `<option value="${x}">
       ${x}
      </option>`
     ).join("")}
    </select>
   </div>`;
  }

  return`
  <div class="form-group">
   <label>${label}</label>
   <input
    id="gf_${key}"
    type="${type||"text"}"
    value="${safe(row?.[key])}">
  </div>`;

 }).join("")}

 </div>


 <div class="modal-actions">

  <button class="btn"
   id="genericCancel">
   Cancel
  </button>

  <button class="btn primary"
   id="genericSave">
   Save
  </button>

 </div>
 `;

 showModal(
  row?"Edit "+title:"Add "+title,
  html
 );

 fields.forEach(f=>{

  if(f[2]==="select"&&row)
   $("gf_"+f[0]).value=
    row[f[0]]||"";

 });


 $("genericCancel").onclick=closeModal;

 $("genericSave").onclick=async()=>{

  const data={};

  fields.forEach(f=>{

   const el=$("gf_"+f[0]);

   data[f[0]]=
    f[2]==="number"
    ?Number(el.value)||0
    :el.value.trim();

  });

  data.updatedAt=serverTimestamp();

  try{

   if(row){

    await updateDoc(
     doc(db,collectionName,row.id),
     data
    );

    await audit(
     "update",
     collectionName,
     row.id,
     data
    );

   }else{

    data.createdAt=serverTimestamp();

    const ref=await addDoc(
     collection(db,collectionName),
     data
    );

    await audit(
     "create",
     collectionName,
     ref.id,
     data
    );
   }

   closeModal();
   toast("Saved.");

   loadPage(currentPage);

  }catch(e){

   toast("Save failed: "+e.message);

  }

 };

}

  "Verify Payment",

   </strong>

   ${safe(p.transactionId||"-")}

  </div>


  <div class="form-group">

   <select id="paymentVerifyStatus">

    <option value="verified">
     Verified
    </option>

    <option value="rejected">
     Rejected
    </option>

   </select>

  </div>


  <div class="form-group">

   <label>Admin Note</label>

   <textarea
    id="paymentVerifyNote"
    rows="3">
   </textarea>

  </div>


  <div class="modal-actions">

   <button class="btn"
    id="cancelVerify">
    Cancel
   </button>

   <button class="btn primary"
    id="saveVerify">
    Save Verification
   </button>

  </div>
  `
 );

 $("cancelVerify").onclick=closeModal;

 $("saveVerify").onclick=async()=>{

  const status=
   $("paymentVerifyStatus").value;

  try{

   await updateDoc(
    doc(db,"payments",p.id),
    {
     status,
     verificationNote:
      $("paymentVerifyNote").value.trim(),
     verifiedBy:currentUser.uid,
     verifiedAt:serverTimestamp(),
     updatedAt:serverTimestamp()
    }
   );


   /*
    Order payment status automatically updated.
   */

   if(p.orderId){

    const ordersData=
     await getRows("orders");

    const order=
     ordersData.find(
      o=>
       o.id===p.orderId||
       o.orderId===p.orderId
     );

    if(order){

     await updateDoc(
      doc(db,"orders",order.id),
      {
       paymentStatus:
        status==="verified"
        ?"paid"
        :"rejected",
       paymentVerification:
        status,
       updatedAt:serverTimestamp()
      }
     );

    }
   }


   await audit(
    "payment_verification",
    "payments",
    p.id,
    {status}
   );

   closeModal();
   toast("Payment verification updated.");
   payments();

  }catch(e){

   toast(
    "Verification failed: "+e.message
   );

  }

 };

}

     ${roles.map(r=>`

   </div>

    <label>Status</label>

    <select id="staffStatus">
     <option value="Active">Active</option>
     <option value="Inactive">Inactive</option>
    </select>

   </div>

  </div>


  <div class="form-group">

   <label>
    Permissions
   </label>

   <div class="grid3">

   ${permissions.map(p=>`

    <label class="checkbox"
     style="
      padding:9px;
      background:#f7f8f2;
      border:1px solid #e2e7dd;
      border-radius:8px
     ">

     <input
      type="checkbox"
      value="${p}"

     <span>${p}</span>

   `).join("")}

   </div>

  </div>


  <div class="modal-actions">

   <button class="btn"
    id="cancelStaff">

   </button>

   <button class="btn primary"
    id="saveStaff">

   </button>

  </div>
  `

  $("staffStatus").value=
   staffData.status||"Active";
 }

  permissions.forEach(p=>{
   perms[p]=
    $("perm_"+p).checked;

  const data={
   name:$("staffName").value.trim(),
   email:$("staffEmail").value.trim(),
   role:$("staffRole").value,
   status:$("staffStatus").value,
   permissions:perms,
   updatedAt:serverTimestamp()

  /*

    return;
   }


   await updateDoc(
    doc(db,"staff",staffData.id),

   await audit(
    "staff_update",

    data
   );

   closeModal();

  <div class="switch">

   <div>
    <b>Free Delivery Enabled</b>
    <p class="muted">
     ON করলে Customer Panel-এ
     Standard/Express-এর পরিবর্তে
     Free Delivery দেখাবে।
    </p>
   </div>

   <input
    id="freeDeliveryEnabled"
    type="checkbox">

  </div>

  <br>

  <div class="form-grid">

   <div class="form-group">
    <label>Campaign Name</label>
    <input id="freeDeliveryCampaignName"
     placeholder="Free Delivery Campaign">
   </div>

   <div class="form-group">
    <label>Free Delivery Charge</label>
    <input id="freeDelivery"
     type="number"
     value="0">
   </div>

  </div>

 </div>


 <div class="panel">

  <h3 style="margin-bottom:15px">
   Delivery Payment Rule
  </h3>

  <div class="switch">

   <div>

    <b>
     Delivery Charge Prepaid Required
    </b>

    <p class="muted">

     ON থাকলে Free Delivery ছাড়া
     customer-কে delivery charge
     আগে pay করতে হবে।

    </p>

   </div>

   <input
    id="deliveryPrepaidRequired"
    type="checkbox">

  </div>

 </div>


 <div class="panel">

  <h3 style="margin-bottom:15px">
   Payment Methods
  </h3>

  <div class="form-grid">

   <div class="form-group">
    <label>bKash Merchant Number</label>
    <input id="bkashNumber">
   </div>

   <div class="form-group">
    <label>Nagad Merchant Number</label>
    <input id="nagadNumber">
   </div>

  </div>

 </div>


 <div class="panel">

  <button
   class="btn primary"
   id="saveSettings">
   Save All Settings
  </button>

 </div>
 `;


 try{

  const snap=
   await getDoc(
    doc(db,"settings","platform")
   );

  const s=
   snap.exists()
   ?snap.data()
   :{};


  $("platformCharge").value=
   s.platformCharge??5;

  $("platformChargeType").value=
   s.platformChargeType||"fixed";

  $("standardDelivery").value=
   s.standardDelivery??60;

  $("expressDelivery").value=
   s.expressDelivery??80;

  $("freeDeliveryEnabled").checked=
   s.freeDeliveryEnabled===true;

  $("freeDeliveryCampaignName").value=
   s.freeDeliveryCampaignName||"";

  $("freeDelivery").value=
   s.freeDelivery??0;

  $("deliveryPrepaidRequired").checked=
   s.deliveryPrepaidRequired!==false;

  $("bkashNumber").value=
   s.bkashNumber||"";

  $("nagadNumber").value=
   s.nagadNumber||"";


 }catch(e){

  toast(
   "Settings load failed: "+e.message
  );

 }


 $("saveSettings").onclick=async()=>{

  const data={

   platformCharge:
    Number($("platformCharge").value)||0,

   platformChargeType:
    $("platformChargeType").value,

   standardDelivery:
    Number($("standardDelivery").value)||0,

   expressDelivery:
    Number($("expressDelivery").value)||0,

   freeDeliveryEnabled:
    $("freeDeliveryEnabled").checked,

   freeDeliveryCampaignName:
    $("freeDeliveryCampaignName").value.trim(),

   freeDelivery:
    Number($("freeDelivery").value)||0,

   deliveryPrepaidRequired:
    $("deliveryPrepaidRequired").checked,

   bkashNumber:
    $("bkashNumber").value.trim(),

   nagadNumber:
    $("nagadNumber").value.trim(),

   updatedAt:serverTimestamp()

  };


  try{

   await setDoc(
    doc(db,"settings","platform"),
    data,
    {merge:true}
   );

   await audit(
    "settings_update",
    "settings",
    "platform",
    data
   );

   toast(
    "Settings saved successfully."
   );

  }catch(e){

   toast(
    "Settings save failed: "+e.message
   );

  }

 };

}


/* =========================================================
 AUDIT LOGS
========================================================= */

async function auditLogs(){

 if(!can("auditLogs"))
  return noAccess();

 $("content").innerHTML=
 pageHead(
  "Audit Logs",
  "Admin and staff activity history",
  `<button class="btn" id="refreshAudit">
   ↻ Refresh
  </button>`
 )+
 `
 <div class="panel">
  <div class="table-wrap" id="auditTable">
   <div class="loading">Loading...</div>
  </div>
 </div>
 `;

 $("refreshAudit").onclick=
  auditLogs;


 try{

  currentRows=
   await getRows("audit_logs");

  currentRows.sort((a,b)=>{
   const ad=a.createdAt?.seconds||0;
   const bd=b.createdAt?.seconds||0;
   return bd-ad;
  });


  $("auditTable").innerHTML=
   currentRows.length
   ?
   `<table>

    <thead>
     <tr>
      <th>Date</th>
      <th>Actor</th>
      <th>Action</th>
      <th>Module</th>
      <th>Record</th>
     </tr>
    </thead>

    <tbody>

    ${currentRows.map(a=>`

     <tr>

      <td>
       ${fmtDate(a.createdAt)}
      </td>

      <td>
       ${safe(a.actorEmail)}
      </td>

      <td>
       ${safe(a.action)}
      </td>

      <td>
       ${safe(a.module)}
      </td>

      <td>
       ${safe(a.recordId)}
      </td>

     </tr>

    `).join("")}

    </tbody>

   </table>`
   :
   `<div class="empty">
    No audit records.
   </div>`;


 }catch(e){

  $("auditTable").innerHTML=
   `<div class="empty">
    ${safe(e.message)}
   </div>`;

 }

}


/* =========================================================
 GLOBAL SEARCH
========================================================= */

$("globalSearch").oninput=()=>{

 const term=
  $("globalSearch").value
  .trim()
  .toLowerCase();

 document
 .querySelectorAll("#content tbody tr")
 .forEach(row=>{

  row.style.display=
   !term||
   row.textContent
    .toLowerCase()
    .includes(term)
   ?""
   :"none";

 });

};
