<script type="module">

const $=id=>document.getElementById(id);

const esc=x=>
 String(x??'')
 .replace(
  /[&<>"']/g,
  m=>({
   '&':'&amp;',
   '<':'&lt;',
   '>':'&gt;',
   '"':'&quot;',
   "'":'&#39;'
  }[m])
 );

const money=n=>
 '৳'+Number(n||0)
 .toLocaleString(
  'en-BD',
  {maximumFractionDigits:2}
 );

const uid=p=>
 p+
 Date.now().toString(36)+
 Math.random().toString(36).slice(2,7);

const toast=x=>{
 const t=$('toast');

 t.textContent=x;

 t.style.display='block';

 setTimeout(
  ()=>t.style.display='none',
  2200
 );
};


let currentUser=null;

let userProfile=null;

let activePage='dashboard';

let unsub=[];


/* =====================================================
   LOGIN SECURITY STATE
===================================================== */

let loginFails=
 Number(
  sessionStorage.getItem('nb_login_fails')||0
 );

let loginLockUntil=
 Number(
  sessionStorage.getItem('nb_login_lock_until')||0
 );

let loginTimer=null;



/* =====================================================
   MODULES
===================================================== */

const modules={

 dashboard:'Dashboard',

 orders:'Orders',

 products:'Products',

 inventory:'Inventory',

 categories:'Categories',

 customers:'Customers',

 riders:'Riders',

};


const allPermissions=[

 'dashboard',
 'orders',
 'products',
 'inventory',
 'categories',
 'customers',
 'riders',
 'partners',
 'payments',
 'refunds',
 'cancellations',
 'offers',
 'lucky',
 'reviews',
 'support',
 'finance',
 'analytics',
 'chalan',
 'staff',
 'notifications',
 'content',

 'reports',

];


const statuses=[

 'Pending',

/* =====================================================

===================================================== */

const defaultSettings={

 businessName:'Nature bite',

 contact:'',

 logo:'🌿',

 deliveryCharge:60,

 freeDeliveryMinimum:1000,

 platformCharge:10,

 minimumOrder:100,

 paymentMethods:{
  bkash:true,
  nagad:true,
  cod:true
 },

 bkash:'',

 nagad:'',

 maintenance:false,

 label:{
  showQR:true,
  showBarcode:true
 },

 customer:{
  showWishlist:true,
  showLuckyWheel:true,
  showLuckyDraw:true,
  showReviews:true,
  showOffers:true
 }

};



/* =====================================================
   ROLES
===================================================== */

const roles={

 SuperAdmin:'*',

 Admin:allPermissions,

 Manager:[
  'dashboard',
  'orders',
  'products',
  'inventory',
  'customers',
  'riders',
  'partners',
  'payments',
  'refunds',
  'offers',
  'lucky',
  'reviews',
  'support',
  'reports',
  'analytics',
  'chalan',
  'notifications'
 ],

 Staff:[
  'dashboard',
  'orders',
  'customers',
  'payments',
  'support',
  'notifications'
 ],

 Rider:[
  'dashboard',
  'orders'
 ]

};



function has(p){

 return(
  userProfile?.role==='SuperAdmin' ||
  roles[userProfile?.role]==='*' ||
  (roles[userProfile?.role]||[]).includes(p)
 );

}



/* =====================================================
   NAVIGATION
===================================================== */

function showPage(p){

 if(!has(p)){

  toast(
   'আপনার এই module-এর permission নেই'
  );

  return;

 }

 activePage=p;

 $('title').textContent=
  modules[p];

 document
  .querySelectorAll('.nav button')
  .forEach(
   b=>
   b.classList.toggle(
    'active',
    b.dataset.p===p
   )
  );

 render();

}


function nav(){

 $('nav').innerHTML=
 Object
  .entries(modules)
  .filter(
   ([p])=>has(p)
  )
  .map(
   ([p,n])=>
   `<button
     data-p="${p}"
     onclick="showPage('${p}')"
   >
     ${icon(p)} ${n}
   </button>`
  )
  .join('');

}


function icon(p){

 return({

  dashboard:'📊',

  orders:'🛒',

  products:'📦',

  inventory:'📋',

  categories:'🗂️',

  customers:'👥',

  riders:'🚴',

  partners:'🚚',

  payments:'💳',

  refunds:'↩️',

  cancellations:'❌',

  offers:'🏷️',

  reviews:'⭐',

  support:'🎧',

  finance:'💰',

  chalan:'🧾',

  staff:'👨‍💼',

  notifications:'🔔',

  content:'⚙️',

  features:'🧩',

  audit:'🛡️',

  reports:'🗓️',

  settings:'🔧'

 })[p]||'•';

}



/* =====================================================
   FIRESTORE HELPERS
===================================================== */

async function col(name){

 const s=
  await FB.getDocs(
   FB.collection(FB.db,name)
  );

 return s.docs.map(
  x=>({
   id:x.id,
   ...x.data()
  })
 );

}


async function one(name,id){

 const s=
  await FB.getDoc(
   FB.doc(FB.db,name,id)
  );

 return s.exists()
  ? {
     id:s.id,
     ...s.data()
    }
  : null;

}


async function put(name,id,data){

 await FB.setDoc(
  FB.doc(FB.db,name,id),
  data,
  {merge:true}
 );

}


async function add(name,data){

 const r=
  await FB.addDoc(
   FB.collection(FB.db,name),
   data
  );

 return r.id;

}


async function remove(name,id){

 await FB.deleteDoc(
  FB.doc(FB.db,name,id)
 );

}


async function log(
 action,
 module,
 target=''
){

 try{

  await add(
   'audit',
   {
    action,
    module,
    target,
    by:currentUser.email,
    at:FB.serverTimestamp()
   }
  );

 }catch(e){

  console.warn(e);

 }

}



async function setting(){

 const x=
  await one(
   'settings',
   'main'
  );

 return{

  ...defaultSettings,

  ...x,

  customer:{
   ...defaultSettings.customer,
   ...(x?.customer||{})
  },

  paymentMethods:{
   ...defaultSettings.paymentMethods,
   ...(x?.paymentMethods||{})
  },

  label:{
   ...defaultSettings.label,
   ...(x?.label||{})
  }

 };

}



async function dataCounts(){

 const names=[

  'orders',
  'products',
  'customers',
  'riders',
  'payments',
  'support',
  'staff',
  'expenses'

 ];

 const out={};

 for(
  const n of names
 ){

  try{

   out[n]=
    (
     await col(n)
    ).length;

  }catch{

   out[n]=0;

  }

 }

 return out;

}



/* =====================================================
   TABLE
===================================================== */

function table(
 headers,
 rows
){

 return`

 <div class="tablewrap">

 <table class="table">

 <thead>

 <tr>

 ${headers
  .map(
   h=>`<th>${h}</th>`
  )
  .join('')}

 </tr>

 </thead>

 <tbody>

 ${
  rows.length

  ?

  rows
   .map(
    r=>
    `<tr>
      ${r.map(
       c=>`<td>${c??''}</td>`
      ).join('')}
     </tr>`
   )
   .join('')

  :

  `<tr>
    <td
     colspan="${headers.length}"
     class="muted"
    >
     No data
    </td>
   </tr>`

 }

 </tbody>

 </table>

 </div>

 `;

}


function badge(x){

 const red=[
  'Cancelled',
  'Rejected',
  'Inactive',
  'Failed'
 ].includes(x);

 const gray=[
  'Pending',
  'Processing'
 ].includes(x);

 return`

 <span
  class="badge
   ${red?'red':gray?'gray':''}"
 >
  ${esc(x)}
 </span>

 `;

}



/* =====================================================
   RENDER
===================================================== */

async function render(){

 const c=$('content');

 c.innerHTML=
  '<div class="panel">Loading…</div>';

 try{

  c.innerHTML=
   await pages[activePage]();

 }catch(e){

  console.error(e);

  c.innerHTML=`

   <div class="panel">

    <h3>Module Error</h3>

    <p>${esc(e.message)}</p>

    <p class="muted">
     Check Firebase configuration
     and Security Rules.
    </p>

   </div>

  `;

 }

}



/* =====================================================
   DASHBOARD
===================================================== */

const pages={

 dashboard:async()=>{

  const[
   c,
   o,
   p,
   r,
   st,
   ex
  ]=await Promise.all([

   dataCounts(),

   col('orders'),

   col('products'),

   col('riders'),

   col('staff'),

   col('expenses')

  ]);


  const delivered=
   o.filter(
    x=>
    [
     'Delivered',
     'Delivery Confirmed'
    ].includes(x.status)
   );


  const pending=
   o.filter(
    x=>x.status==='Pending'
   ).length;


  const cancelled=
   o.filter(
    x=>x.status==='Cancelled'
   ).length;


  const sales=
   delivered.reduce(
    (a,x)=>a+orderTotal(x),
    0
   );


  const expenses=
   ex.reduce(
    (a,x)=>a+Number(x.amount||0),
    0
   );


  const low=
   p.reduce(
    (a,x)=>
    a+
    (x.variants||[])
     .filter(
      v=>
      Number(v.stock||0)
      <=
      Number(v.threshold||0)
     ).length,
    0
   );


  return`

    delivered.length

   ${metric(
    'Pending',
    pending

   ${metric(
    'Cancelled',
    cancelled

   ${metric(
    'Net Profit',
    money(sales-expenses)

    'Low Stock',
    low

    c.staff

   <div class="panel">

    <h3>Order Status</h3>

    ${table(

     ['Status','Count'],

     statuses.map(
      s=>[

/* =====================================================
   ORDER TOTAL
===================================================== */

function orderTotal(o){

 const productTotal=
  (o.products||[])
   .reduce(
    (a,p)=>
    a+
    Number(p.qty||0)*
    Number(p.price||0),
    0
   );

 return Math.max(
  0,
  productTotal+
  Number(o.deliveryCharge||0)+
  Number(o.platformCharge||0)-
  Number(o.discount||0)
 );

}

async function roi(){

 const os=
  await col('orders');

 const ex=
  await col('expenses');


 const rev=
  os.reduce(
   (a,o)=>
   a+orderTotal(o),
   0
  );


 const cost=
  ex.reduce(
   (a,x)=>
   a+Number(x.amount||0),
   0
  );


 return cost
  ?
  (
   (rev-cost)/
   cost*
   100
  ).toFixed(1)+'%'
  :
  'N/A';

}


async function cashFlow(){

 const os=
  await col('orders');

 const ex=
  await col('expenses');


 return

 os.reduce(
  (a,o)=>
  a+orderTotal(o),
  0
 )

 -

 ex.reduce(
  (a,x)=>
  a+Number(x.amount||0),
  0
 );

}



async function analyticsTab(name){

 const os=
  await col('orders');

 const cs=
  await col('customers');

 const ex=
  await col('expenses');


 const rev=
  os.reduce(
   (a,o)=>
   a+orderTotal(o),
   0
  );


 const cost=
  ex.reduce(
   (a,x)=>
   a+Number(x.amount||0),
   0
  );


 const aov=
  os.length
   ?
   rev/os.length
   :
   0;


 let v=
  'Data-driven view';


 if(name==='ROI')
  v=await roi();


 if(name==='Cash Flow')
  v=money(
   await cashFlow()
  );


 if(name==='AOV')
  v=money(aov);


 if(name==='ARPU')
  v=money(
   cs.length
    ?
    rev/cs.length
    :
    0
  );


 if(name==='Break-even Point')
  v=
   cost+
   ' / contribution margin';


 if(name==='CAC & LTV')
  v=
   'Enter marketing spend and repeat-customer data in Finance';


 if(name==='NPS')
  v=
   'Customer survey score';


 if(name==='Funnel')
  v=
   `Orders:
    ${os.length}
    →
    Delivered:
    ${
     os.filter(
      o=>
      [
       'Delivered',
       'Delivery Confirmed'
      ].includes(o.status)
     ).length
    }`;


 if(name==='North Star Metric')
  v=
   'Completed customer orders';


 if(name==='ARR/MRR')
  v=
   'Monthly recurring revenue model';


 $('analyticsBox').innerHTML=`

  <h3>

  <div class="card">

   <b style="font-size:28px">

    ${esc(
     String(v)

 `;

}

function setLoginLoading(on){

 if(on){

   'loginloading'
  );

  b.innerHTML=

  );

 }

}



/* =====================================================
   LOGIN LOCK
===================================================== */

function applyLoginLock(){

 const now=
  Date.now();

 const b=
  $('loginBtn');


 if(
  loginLockUntil>
  now
 ){

  b.disabled=true;


  const sec=
   Math.ceil(
    (
     loginLockUntil-
     now
    )/1000
   );


  b.textContent=
   `লকড (${sec}s)`;


  showLoginMessage(

   `নিরাপত্তার জন্য Login সাময়িকভাবে লক করা হয়েছে। ${sec} সেকেন্ড পরে আবার চেষ্টা করুন।`

  );


  clearTimeout(
   loginTimer
  );


  loginTimer=
   setTimeout(
    applyLoginLock,
    500
   );


  return;

 }


 if(loginLockUntil){

  loginLockUntil=0;

  sessionStorage.removeItem(
   'nb_login_lock_until'
  );

  loginFails=0;

  sessionStorage.removeItem(
   'nb_login_fails'
  );

 }


 b.disabled=false;


 if(
  b.textContent
   .startsWith('লকড')
 ){

  b.textContent=
   'Login';

 }

}



/* =====================================================
   LOGIN FAILURE
===================================================== */

function registerLoginFailure(){

 loginFails++;


 sessionStorage.setItem(
  'nb_login_fails',
  loginFails
 );


 if(loginFails>=5){

  loginLockUntil=
   Date.now()+60000;


  sessionStorage.setItem(
   'nb_login_lock_until',
   loginLockUntil
  );


  applyLoginLock();

 }

}



/* =====================================================
   CLEAR LOGIN FAILURES
===================================================== */

function clearLoginFailures(){

 loginFails=0;

 loginLockUntil=0;

 sessionStorage.removeItem(
  'nb_login_fails'
 );

 sessionStorage.removeItem(
  'nb_login_lock_until'
 );

 clearTimeout(
  loginTimer
 );

}

   'Firebase-এর অভ্যন্তরীণ সমস্যা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।',

  'auth/invalid-api-key':
   'Firebase API Key সঠিক নয়।',

  'auth/app-not-authorized':
   'এই ডোমেইন Firebase Authentication-এ অনুমোদিত নয়।',

  'auth/requires-recent-login':
   'নিরাপত্তার জন্য আবার Login করতে হবে।'

 };


 return(
  map[c]||
  (
   'Firebase error: '+
   (
    e?.message||
    'অজানা সমস্যা'
   )
  )
 );

}



/* =====================================================
   USER BOOT
===================================================== */

async function bootUser(user){

 currentUser=user;


 try{

  const p=
   await one(
    'staff',
    user.uid
   );


  if(!p){

   await FB.signOut(
    FB.auth
   );


   showLoginMessage(
    'এই account-এর Staff profile পাওয়া যায়নি। Firebase Firestore-এর staff/{User UID} document তৈরি করুন। এটি Admin/Staff authorization-এর জন্য প্রয়োজন।'
   );


   return;

  }


  userProfile=p;


  if(
   userProfile.active===false ||
   userProfile.locked===true
  ){

   await FB.signOut(
    FB.auth
   );


   showLoginMessage(

    userProfile.locked===true

     ?

     'আপনার Admin/Staff account বর্তমানে LOCKED। Super Admin account থেকে Unlock করতে হবে।'

     :

     'আপনার Admin/Staff account বর্তমানে INACTIVE। Super Admin account থেকে Active না করা পর্যন্ত Login করা যাবে না।'

   );


   return;

  }


  $('login').style.display=
   'none';

  $('app').style.display=
   'block';


  $('userMini').textContent=
   `${
    userProfile.name||
    user.email
   } • ${
    userProfile.role
   }`;


  nav();

  showPage(
   'dashboard'
  );


  $('sync').textContent=
   'Firebase connected';

  $('sync').className=
   'badge';


 }catch(e){

  await FB
   .signOut(FB.auth)
   .catch(
    ()=>{}
   );


  showLoginMessage(
   firebaseErrorBn(e)
  );

 }

}



/* =====================================================
   LOGIN
===================================================== */

async function doLogin(){

 clearLoginMessage();


 if(
  loginLockUntil>
  Date.now()
 ){

  applyLoginLock();

  return;

 }


 const email=
  $('email')
   .value
   .trim();

 const password=
  $('password')
   .value;


 if(!email){

  showLoginMessage(
   'আপনার Email দিন।'
  );

  $('email').focus();

  return;

 }


 if(!password){

  showLoginMessage(
   'আপনার Password দিন।'
  );

  $('password').focus();

  return;

 }


 setLoginLoading(true);


 try{

  const remember=
   $('rememberLogin')
    .checked;


  await FB.setPersistence(

   FB.auth,

   remember

    ?

    FB.browserLocalPersistence

    :

    FB.browserSessionPersistence

  );


  await FB
   .signInWithEmailAndPassword(
    FB.auth,
    email,
    password
   );


  clearLoginFailures();


 }catch(e){

  registerLoginFailure();

  showLoginMessage(
   firebaseErrorBn(e)
  );

  setLoginLoading(false);

 }

}



/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function doForgotPassword(){

 clearLoginMessage();


 const email=
  $('email')
   .value
   .trim();


 if(!email){

  showLoginMessage(
   'Password reset link পেতে আগে আপনার Email লিখুন।'
  );

  $('email').focus();

  return;

 }


 const b=
  $('forgotBtn');


 b.disabled=true;

 b.textContent=
  'পাঠানো হচ্ছে…';


 try{

  await FB
   .sendPasswordResetEmail(
    FB.auth,
    email
   );


  showLoginMessage(

   'Password reset link আপনার Email-এ পাঠানো হয়েছে। Inbox/Spam folder দেখুন।',

   'ok'

  );


 }catch(e){

  showLoginMessage(
   firebaseErrorBn(e)
  );


 }finally{

  b.disabled=false;

  b.textContent=
   'Forgot Password?';

 }

}



/* =====================================================
   AUTH UI
===================================================== */

function initAuthUI(){

 const login=
  $('loginBtn');


 if(!login)return;


 applyLoginLock();


 login.onclick=
  doLogin;


 $('forgotBtn').onclick=
  doForgotPassword;


 $('togglePassword').onclick=
  ()=>{

   const p=
    $('password');

   const b=
    $('togglePassword');


   p.type=
    p.type==='password'
     ? 'text'
     : 'password';


   b.textContent=
    p.type==='password'
     ? 'Show'
     : 'Hide';

  };


 $('password')
  .addEventListener(
   'keydown',
   e=>{

    if(
     e.key==='Enter'
    )
     doLogin();

   }
  );


 $('email')
  .addEventListener(
   'keydown',
   e=>{

    if(
     e.key==='Enter'
    )
     $('password').focus();

   }
  );


 $('logout').onclick=
  async()=>{

   await FB.signOut(
    FB.auth
   );


   $('app').style.display=
    'none';


   $('login').style.display=
    'grid';


   $('password').value='';


   clearLoginMessage();


   setLoginLoading(
    false
   );

  };


 onAuthStateChanged(
  FB.auth,
  u=>
   u
    ? bootUser(u)
    : null
 );

}


if(
 window.firebaseReady
)
 initAuthUI();
else
 window.addEventListener(
  'firebase-ready',
  initAuthUI,
  {once:true}
);
