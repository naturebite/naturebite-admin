<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Nature bite — Production Admin Panel</title>

<style>
:root{
  --g:#2E7D32;
  --s:#A5C18E;
  --c:#F5F2E8;
  --b:#5D4037;
  --line:#dfe6dc;
  --danger:#b42318;
  --muted:#607D8B;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  background:#f7f9f5;
  color:#263238;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.login{
  min-height:100vh;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,var(--c),#e9f1e5);
}

.loginbox{
  width:min(420px,92vw);
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:26px;
  box-shadow:0 12px 40px #0001;
}

.brand{
  font-size:26px;
  font-weight:900;
  color:var(--g);
}

.muted{
  color:var(--muted);
}

.app{
  display:none;
}

.side{
  position:fixed;
  inset:0 auto 0 0;
  width:245px;
  background:#183d1b;
  color:#fff;
  overflow:auto;
  padding:16px;
}

.side h2{
  margin:0 0 16px;
}

.nav button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  color:#eaf4e8;
  text-align:left;
  padding:10px 12px;
  border-radius:9px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#ffffff18;
}

.main{
  margin-left:245px;
}

.top{
  position:sticky;
  top:0;
  z-index:4;
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:12px 18px;
  display:flex;
  align-items:center;
  gap:10px;
}

.top strong{
  flex:1;
}

.content{
  padding:18px;
  max-width:1500px;
  margin:auto;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.card,
.panel{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:16px;
}

.metric b{
  font-size:25px;
  display:block;
  margin-top:6px;
}

.pagehead{
  display:flex;
  gap:12px;
  align-items:center;
  justify-content:space-between;
  margin-bottom:14px;
}

.pagehead h2{
  margin:0;
}

.btn{
  border:0;
  border-radius:9px;
  background:var(--g);
  color:#fff;
  padding:9px 13px;
  font-weight:700;
}

.btn.gray{
  background:#607d8b;
}

.btn.red{
  background:var(--danger);
}

.btn.light{
  background:#eaf3e7;
  color:#245c28;
}

.btn.small{
  padding:6px 9px;
  font-size:13px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.field label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-bottom:5px;
}

.field input,
.field select,
.field textarea,
.search{
  width:100%;
  padding:9px;
  border:1px solid #cfd8cf;
  border-radius:8px;
  background:#fff;
}

.field textarea{
  min-height:90px;
}

.full{
  grid-column:1/-1;
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.tablewrap{
  overflow:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:9px;
  border-bottom:1px solid #e7ece5;
  text-align:left;
  vertical-align:top;
  font-size:13px;
}

.table th{
  background:#f4f7f2;
}

.badge{
  display:inline-block;
  border-radius:99px;
  padding:4px 8px;
  background:#e8f1e8;
  color:#25602a;
  font-size:12px;
  font-weight:800;
}

.badge.red{
  background:#fee4e2;
  color:#9b1c13;
}

.badge.gray{
  background:#edf1f2;
  color:#455a64;
}

.tabs{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.tabs button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:7px 10px;
}

.tabs button.active{
  background:var(--g);
  color:#fff;
}

.switch{
  display:flex;
  gap:8px;
  align-items:center;
  padding:9px 0;
}

.alert{
  padding:10px;
  border-radius:9px;
  background:#eef6ed;
  margin:10px 0;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:20;
}

.modalbox{
  background:#fff;
  width:min(850px,96vw);
  max-height:92vh;
  overflow:auto;
  border-radius:16px;
  padding:18px;
}

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#183d1b;
  color:#fff;
  padding:11px 14px;
  border-radius:10px;
  z-index:30;
}

.label{
  width:3in;
  min-height:5in;
  border:1px solid #222;
  background:#fff;
  padding:.12in;
  font-size:10px;
  color:#111;
}

.label h2{
  font-size:16px;
  margin:0 0 5px;
}

.label .row{
  margin:3px 0;
}

.label .line{
  border-top:1px solid #aaa;
  margin:5px 0;
}

@media(max-width:900px){

  .side{
    position:static;
    width:auto;
    max-height:260px;
  }

  .main{
    margin:0;
  }

  .grid,
  .grid2,
  .grid3,
  .formgrid{
    grid-template-columns:1fr;
  }

  .top{
    position:static;
  }
}

@media print{

  body{
    background:#fff;
  }

  .side,
  .top,
  .content>.no-print,
  .modal,
  .toast{
    display:none!important;
  }

  .main{
    margin:0;
  }

  @page{
    size:3in 5in;
    margin:0;
  }
}
</style>

<script type="module">

const $ =
id => document.getElementById(id);


const esc =
x =>
String(x ?? "")
.replace(
  /[&<>"']/g,
  m =>
  ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[m])
);


const money =
n =>
"৳" +
Number(n || 0)
.toLocaleString(
  "en-BD",
  {
    maximumFractionDigits:2
  }
);


const uid =
p =>
p +
Date.now().toString(36) +
Math.random()
.toString(36)
.slice(2,7);


const toast =
x => {

  const t =
  $("toast");

  t.textContent =
  x;

  t.style.display =
  "block";

  setTimeout(
    () =>
    t.style.display =
    "none",
    2200
  );
};


let currentUser =
null;

let userProfile =
null;

let activePage =
"dashboard";


/* =========================================================
   MODULES
========================================================= */

const modules = {

  dashboard:
  "Dashboard",

  orders:
  "Orders",

  products:
  "Products",

  inventory:
  "Inventory",

  categories:
  "Categories",

  customers:
  "Customers",

  riders:
  "Riders",

  partners:
  "Delivery Partners",

  payments:
  "Payments",

  refunds:
  "Refunds",

  cancellations:
  "Cancellations",

  offers:
  "Offers & Coupons",

  lucky:
  "Lucky Wheel / Draw",

  reviews:
  "Reviews",

  support:
  "Support Tickets",

  finance:
  "Finance & Expenses",

  analytics:
  "Business Analytics",

  chalan:
  "Chalan",

  staff:
  "Staff & Permissions",

  notifications:
  "Notifications",

  content:
  "Customer Panel Settings",

  features:
  "Feature Management",

  audit:
  "Audit Logs",

  reports:
  "Monthly Reports",

  settings:
  "System Settings"

};


/* =========================================================
   PERMISSIONS
========================================================= */

const allPermissions = [

  "dashboard",
  "orders",
  "products",
  "inventory",
  "categories",
  "customers",
  "riders",
  "partners",
  "payments",
  "refunds",
  "cancellations",
  "offers",
  "lucky",
  "reviews",
  "support",
  "finance",
  "analytics",
  "chalan",
  "staff",
  "notifications",
  "content",
  "features",
  "audit",
  "reports",
  "settings"

];


const roles = {

  SuperAdmin:
  "*",

  Admin:
  allPermissions,

  Manager:
  [
    "dashboard",
    "orders",
    "products",
    "inventory",
    "customers",
    "riders",
    "partners",
    "payments",
    "refunds",
    "offers",
    "lucky",
    "reviews",
    "support",
    "reports",
    "analytics",
    "chalan",
    "notifications"
  ],

  Staff:
  [
    "dashboard",
    "orders",
    "customers",
    "payments",
    "support",
    "notifications"
  ],

  Rider:
  [
    "dashboard",
    "orders"
  ]

};


function has(permission){

  return (

    userProfile?.role ===
    "SuperAdmin"

    ||

    roles[
      userProfile?.role
    ] === "*"

    ||

    (
      roles[
        userProfile?.role
      ] || []
    )
    .includes(permission)

  );

}


/* =========================================================
   CUSTOMER PANEL SETTINGS
========================================================= */

const defaultSettings = {

  businessName:
  "Nature bite",

  contact:
  "",

  address:
  "Chattogram, Bangladesh",

  logo:
  "🌿",

  deliveryCharge:
  60,

  freeDeliveryMinimum:
  1000,

  platformCharge:
  10,

  minimumOrder:
  100,

  deliveryAdvance:
  true,

  platformChargeEnabled:
  true,

  fullPaymentEnabled:
  true,

  paymentMethods:{
    bkash:true,
    nagad:true,
    cod:true
  },

  bkash:"",
  nagad:"",

  maintenance:
  false,

  label:{
    showQR:true,
    showBarcode:true
  },

  customer:{
    showWishlist:true,
    showLuckyWheel:true,
    showLuckyDraw:true,
    showReviews:true,
    showOffers:true
  }

};


/* =========================================================
   FIRESTORE HELPERS
========================================================= */

async function col(name){

  const snap =
  await FB.getDocs(
    FB.collection(
      FB.db,
      name
    )
  );

  return snap.docs.map(
    x =>
    ({
      id:x.id,
      ...x.data()
    })
  );

}


async function one(
  name,
  id
){

  const snap =
  await FB.getDoc(
    FB.doc(
      FB.db,
      name,
      id
    )
  );

  return snap.exists()
    ?
    {
      id:snap.id,
      ...snap.data()
    }
    :
    null;

}


async function put(
  name,
  id,
  data
){

  await FB.setDoc(
    FB.doc(
      FB.db,
      name,
      id
    ),
    data,
    {
      merge:true
    }
  );

}


async function add(
  name,
  data
){

  const r =
  await FB.addDoc(
    FB.collection(
      FB.db,
      name
    ),
    data
  );

  return r.id;

}


async function remove(
  name,
  id
){

  await FB.deleteDoc(
    FB.doc(
      FB.db,
      name,
      id
    )
  );

}


async function log(
  action,
  module,
  target=""
){

  try{

    await add(
      "audit",
      {

        action,
        module,
        target,

        by:
        currentUser.email,

        at:
        FB.serverTimestamp()

      }
    );

  }

  catch(e){

    console.warn(e);

  }

}


async function setting(){

  const x =
  await one(
    "settings",
    "main"
  );

  return {

    ...defaultSettings,

    ...x,

    customer:{
      ...defaultSettings.customer,
      ...(x?.customer || {})
    },

    paymentMethods:{
      ...defaultSettings.paymentMethods,
      ...(x?.paymentMethods || {})
    },

    label:{
      ...defaultSettings.label,
      ...(x?.label || {})
    }

  };

}


/* =========================================================
   NAVIGATION
========================================================= */

function showPage(p){

  if(!has(p)){

    toast(
      "আপনার এই module-এর permission নেই"
    );

    return;

  }

  activePage =
  p;

  $("title").textContent =
  modules[p];

  document
  .querySelectorAll(".nav button")
  .forEach(
    b =>
    b.classList.toggle(
      "active",
      b.dataset.p === p
    )
  );

  render();

}


function nav(){

  $("nav").innerHTML =

  Object
  .entries(modules)

  .filter(
    ([p]) =>
    has(p)
  )

  .map(
    ([p,n]) =>
    `
    <button
      data-p="${p}"
      onclick="showPage('${p}')"
    >
      ${icon(p)} ${n}
    </button>
    `
  )
  .join("");

}


function icon(p){

  return {

    dashboard:"📊",
    orders:"🛒",
    products:"📦",
    inventory:"📋",
    categories:"🗂️",
    customers:"👥",
    riders:"🚴",
    partners:"🚚",
    payments:"💳",
    refunds:"↩️",
    cancellations:"❌",
    offers:"🏷️",
    lucky:"🎯",
    reviews:"⭐",
    support:"🎧",
    finance:"💰",
    analytics:"📈",
    chalan:"🧾",
    staff:"👨‍💼",
    notifications:"🔔",
    content:"⚙️",
    features:"🧩",
    audit:"🛡️",
    reports:"🗓️",
    settings:"🔧"

  }[p] || "•";

}


/* =========================================================
   COMMON TABLE
========================================================= */

function table(
  headers,
  rows
){

  return `

  <div class="tablewrap">

  <table class="table">

  <thead>

  <tr>

  ${
    headers
    .map(
      h =>
      `<th>${h}</th>`
    )
    .join("")
  }

  </tr>

  </thead>

  <tbody>

  ${
    rows.length

    ?

    rows
    .map(
      r =>
      `
      <tr>
      ${
        r
        .map(
          c =>
          `<td>${c ?? ""}</td>`
        )
        .join("")
      }
      </tr>
      `
    )
    .join("")

    :

    `
    <tr>
      <td
        colspan="${headers.length}"
        class="muted"
      >
        No data
      </td>
    </tr>
    `
  }

  </tbody>

  </table>

  </div>

  `;

}


function badge(x){

  const red =
  [
    "Cancelled",
    "Rejected",
    "Inactive",
    "Failed"
  ]
  .includes(x);

  const gray =
  [
    "Pending",
    "Processing"
  ]
  .includes(x);

  return `

  <span
    class="badge
    ${red?"red":gray?"gray":""}"
  >
    ${esc(x)}
  </span>

  `;

}


function metric(
  key,
  value
){

  return `

  <div class="card metric">

    <span class="muted">
      ${key}
    </span>

    <b>
      ${value}
    </b>

  </div>

  `;

}


/* =========================================================
   ORDER TOTAL
========================================================= */

function orderTotal(o){

  return (

    (o.products || [])
    .reduce(
      (a,p) =>
      a +
      Number(p.qty || 0) *
      Number(p.price || 0),
      0
    )

    +

    Number(
      o.deliveryCharge || 0
    )

    +

    Number(
      o.platformCharge || 0
    )

    -

    Number(
      o.discount || 0
    )

  );

}


/* =========================================================
   ORDER STATUS
========================================================= */

const statuses = [

  "Pending",
  "Confirmed",
  "Preparing",
  "Ready",
  "Rider Assigned",
  "Picked Up",
  "On the Way",
  "Delivered",
  "Delivery Confirmed",
  "Cancelled"

];


const deliveryLevels = [

  "Level 1",
  "Level 2",
  "Level 3"

];


/* =========================================================
   RENDER
========================================================= */

async function render(){

  const c =
  $("content");

  c.innerHTML =
  `
  <div class="panel">
    Loading…
  </div>
  `;

  try{

    c.innerHTML =
    await pages[
      activePage
    ]();

  }

  catch(e){

    console.error(e);

    c.innerHTML = `

    <div class="panel">

      <h3>
        Module Error
      </h3>

      <p>
        ${esc(e.message)}
      </p>

      <p class="muted">
        Check Firebase configuration
        and Security Rules.
      </p>

    </div>

    `;

  }

}


/* =========================================================
   DASHBOARD
========================================================= */

const pages = {


dashboard:
async() => {

  const [

    orders,
    products,
    customers,
    riders,
    staff

async function saveOrder(
  id
){

  const riders =
  await col("riders");


  const rid =
  $("orider").value;


  const r =
  riders.find(
    x =>
    x.id === rid
  );


  await put(
    "orders",
    id,
    {

      status:
      $("ostatus").value,

      rider:
      rid,

      riderName:
      r?.name || "",

      riderMobile:
      r?.mobile || "",

      deliveryLevel:
      $("olevel").value,

      deliveryLevelConfirmed:
      $("oconfirm").checked,

      deliveryInstruction:
      $("oinstruction").value,

      updatedAt:
      FB.serverTimestamp()

    }
  );


  await log(
    "Updated order",
    "Orders",
    id
  );


  closeModal();

  toast(
    "Order updated"
  );

  render();

}

async function saveProduct(
  id
){

  let variants=[];


  try{

    variants =
    JSON.parse(
      $("pvar")
      .value || "[]"
    );

  }

  catch{

    toast(
      "Variants JSON ভুল"
    );

    return;

  }


  const data = {

    name:
    $("pn").value,

    category:
    $("pcat").value,

    active:
    $("pactive").checked,

    variants,

    updatedAt:
    FB.serverTimestamp()

  };


  if(id){

    await put(
      "products",
      id,
      data
    );

  }

  else{

    await put(
      "products",
      uid("P"),
      {
        ...data,
        createdAt:
        FB.serverTimestamp()
      }
    );

  }


  await log(
    id
    ?
    "Edited product"
    :
    "Added product",

    "Products",

    id ||
    "new"
  );


  closeModal();

  render();

}

/* =========================================================
   FINANCE CALCULATIONS
========================================================= */

async function roi(){

  const os =
  await col("orders");

  const ex =
  await col("expenses");


  const rev =
  os.reduce(
    (a,o) =>
    a +
    orderTotal(o),
    0
  );


  const cost =
  ex.reduce(
    (a,x) =>
    a +
    Number(x.amount || 0),
    0
  );


  return cost

  ?

  (
    (
      rev -
      cost
    )
    /
    cost
    *
    100
  )
  .toFixed(1)
  +
  "%"

  :

  "N/A";

}


async function cashFlow(){

  const os =
  await col("orders");

  const ex =
  await col("expenses");


  return

  os.reduce(
    (a,o) =>
    a +
    orderTotal(o),
    0
  )

  -

  ex.reduce(
    (a,x) =>
    a +
    Number(x.amount || 0),
    0
  );

}

  let value =
  "Data-driven view";


  if(name === "ROI")
    value =
    await roi();


  if(name === "Cash Flow")
    value =
    money(
      await cashFlow()
    );


  if(name === "AOV")
    value =
    money(aov);


  if(name === "ARPU")
    value =
    money(
      cs.length
      ?
      rev /
      cs.length
      :
      0
    );


  if(name === "Break-even Point")
    value =
    cost +
    " / contribution margin";


  if(name === "CAC & LTV")
    value =
    "Enter marketing spend and repeat-customer data in Finance";


  if(name === "NPS")
    value =
    "Customer survey score";


  if(name === "Funnel")
    value =
    `
    Orders:
    ${os.length}
    →
    Delivered:
    ${
      os.filter(
        o =>
        [
          "Delivered",
          "Delivery Confirmed"
        ]
        .includes(o.status)
      ).length
    }
    `;


  if(name === "North Star Metric")
    value =
    "Completed customer orders";


  $("analyticsBox")
  .innerHTML = `

  <h3>
    ${esc(name)}
  </h3>

  <div class="card">

    <b
      style="
        font-size:28px
      "
    >
      ${esc(
        String(value)
      )}
    </b>

  </div>

  <p class="muted">

    This metric is isolated
    as a separate
    business-performance tab.

  </p>

  `;

}


/* =========================================================
   STATUS / ACTIVE
========================================================= */

async function setStatus(
  collectionName,
  id,
  status
){

  await put(

    collectionName,

    id,

    {

      status,

      updatedAt:
      FB.serverTimestamp()

    }

  );


  await log(
    "Status changed to " + status,
    collectionName,
    id
  );


  toast(
    "Updated"
  );


  render();

}


async function toggleActive(
  collectionName,
  id,
  current
){

  await put(

    collectionName,

    id,

    {
      active:
      !current
    }

  );


  toast(
    "Updated"
  );


  render();

}


async function toggleFeature(
  id,
  key
){

  const x =
  await one(
    "features",
    id
  );


  await put(

    "features",

    id,

    {

      [key]:
      !x[key]

    }

  );


  render();

}


async function delItem(
  collectionName,
  id
){

  if(
    !confirm(
      "Delete this item?"
    )
  )
    return;


  await remove(
    collectionName,
    id
  );


  await log(
    "Deleted item",
    collectionName,
    id
  );


  render();

}

/* =========================================================
   USER BOOT
========================================================= */

async function bootUser(
  user
){

  currentUser =
  user;


  const p =
  await one(
    "staff",
    user.uid
  );


  userProfile =
  p ||

  {

    name:
    user.email,

    role:
    "Staff",

    active:
    true,

    email:
    user.email

  };


  if(
    userProfile.active ===
    false
  ){

    await FB.signOut(
      FB.auth
    );

    return;

  }


  $("login")
  .style.display =
  "none";


  $("app")
  .style.display =
  "block";


  $("userMini")
  .textContent =

  `${
    userProfile.name ||
    user.email
  } • ${
    userProfile.role
  }`;


  nav();


  showPage(
    "dashboard"
  );


  $("sync")
  .textContent =
  "Firebase connected";


  $("sync")
  .className =
  "badge";

}


/* =========================================================
   AUTH
========================================================= */

window.addEventListener(
  "firebase-ready",
  () => {

    FB
    .auth;

    onAuthStateChanged(
      FB.auth,
      user => {

        if(user){

          bootUser(
            user
          );

        }

      }
    );


    $("loginBtn")
    .onclick =
    async() => {

      try{

        $("loginMsg")
        .style.display =
        "none";


        await
        FB
        .signInWithEmailAndPassword(

          FB.auth,

          $("email")
          .value
          .trim(),

          $("password")
          .value

        );

      }

      catch(e){

        $("loginMsg")
        .textContent =
        "Login failed: " +
        e.message;


        $("loginMsg")
        .style.display =
        "block";

      }

    };


    $("logout")
    .onclick =
    () =>
    FB
    .signOut(
      FB.auth
    );

  }
);

</script>
