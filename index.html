<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>NatureBite Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --green:#155d3a;
  --green2:#1d7a4d;
  --light:#f4f7f1;
  --cream:#faf8f1;
  --border:#e4e8df;
  --text:#17251d;
  --muted:#718078;
  --red:#c62828;
  --orange:#e67e22;
  --blue:#2878c8;
  --white:#fff;
  --shadow:0 8px 30px rgba(20,50,30,.07);
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:var(--light);
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

#loginScreen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top left,#dcebdc,transparent 35%),
    linear-gradient(135deg,#f6f8f1,#e9f0e8);
  padding:20px;
}

.login-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  padding:34px;
  box-shadow:0 20px 70px rgba(20,60,30,.15);
}

.logo{
  text-align:center;
  margin-bottom:28px;
}

.logo-mark{
  width:65px;
  height:65px;
  margin:auto;
  border-radius:20px;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  font-weight:900;
}

.logo h1{
  margin-top:12px;
  color:var(--green);
  font-size:28px;
}

.logo p{
  color:var(--muted);
  margin-top:5px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.input,
.select,
.textarea{
  width:100%;
  border:1px solid var(--border);
  background:#fff;
  border-radius:11px;
  padding:12px 13px;
  outline:none;
}

.input:focus,
.select:focus,
.textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 3px rgba(21,93,58,.08);
}

.textarea{
  min-height:100px;
  resize:vertical;
}

.primary{
  border:0;
  background:var(--green);
  color:#fff;
  padding:11px 16px;
  border-radius:10px;
  font-weight:700;
}

.primary:hover{
  background:var(--green2);
}

.secondary{
  border:1px solid var(--border);
  background:#fff;
  color:var(--text);
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
}

.secondary:hover{
  background:#f4f7f1;
}

.danger{
  border:0;
  background:#fff0f0;
  color:var(--red);
  padding:10px 14px;
  border-radius:10px;
  font-weight:700;
}

.login-btn{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  background:var(--green);
  color:#fff;
  font-weight:800;
  font-size:16px;
}

.login-btn:disabled{
  opacity:.6;
}

.login-error{
  min-height:22px;
  margin-top:12px;
  color:var(--red);
  font-size:13px;
  line-height:1.5;
}

.forgot{
  margin-top:15px;
  text-align:center;
  color:var(--green);
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

/* ================= APP ================= */

#app{
  display:none;
  min-height:100vh;
}

#app.show{
  display:flex;
}

.sidebar{
  width:255px;
  min-width:255px;
  min-height:100vh;
  background:#103f2a;
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow-y:auto;
  z-index:100;
  padding-bottom:20px;
}

.brand{
  padding:22px 20px;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.brand-title{
  font-size:24px;
  font-weight:900;
}

.brand-sub{
  font-size:11px;
  color:#b9d4c5;
  margin-top:4px;
}

.nav-section{
  padding:18px 14px 6px;
  font-size:10px;
  letter-spacing:1px;
  color:#91b5a1;
  font-weight:800;
}

.nav-btn{
  width:calc(100% - 18px);
  margin:2px 9px;
  border:0;
  background:transparent;
  color:#dcebe2;
  text-align:left;
  padding:10px 12px;
  border-radius:9px;
  font-size:13px;
}

.nav-btn:hover,
.nav-btn.active{
  background:#1b6945;
  color:#fff;
}

.sidebar-bottom{
  margin-top:18px;
  padding:14px;
  border-top:1px solid rgba(255,255,255,.1);
}

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-height:100vh;
}

.topbar{
  height:70px;
  background:#fff;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 25px;
  position:sticky;
  top:0;
  z-index:50;
}

.top-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.mobile-menu{
  display:none;
  border:1px solid var(--border);
  background:#fff;
  padding:9px 12px;
  border-radius:9px;
}

.top-search{
  width:300px;
}

.top-right{
  display:flex;
  align-items:center;
  gap:10px;
}

.identity{
  text-align:right;
}

.identity strong{
  display:block;
  font-size:13px;
}

.identity span{
  font-size:11px;
  color:var(--muted);
}

.avatar{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.content{
  padding:25px;
  max-width:1600px;
  margin:auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
}

.page-head h2{
  font-size:24px;
}

.page-head p{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:15px;
  box-shadow:var(--shadow);
}

.kpi-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:13px;
  margin-bottom:20px;
}

.kpi{
  padding:17px;
}

.kpi-label{
  font-size:12px;
  color:var(--muted);
}

.kpi-value{
  font-size:23px;
  font-weight:900;
  margin-top:7px;
}

.kpi-note{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
}

.dashboard-grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:18px;
}

.panel{
  padding:18px;
  margin-bottom:18px;
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.panel-title h3{
  font-size:16px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.grid-4{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f7f9f5;
  color:#637169;
  font-size:11px;
  text-align:left;
  padding:11px;
  white-space:nowrap;
}

td{
  padding:12px 11px;
  border-bottom:1px solid #edf0eb;
  font-size:12px;
  vertical-align:middle;
}

tr:last-child td{
  border-bottom:0;
}

.table-wrap{
  overflow-x:auto;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:20px;
  font-size:10px;
  font-weight:800;
  background:#e9f3ec;
  color:var(--green);
}

.badge.red{
  background:#ffe9e9;
  color:var(--red);
}

.badge.orange{
  background:#fff0df;
  color:#bd6413;
}

.badge.blue{
  background:#e8f2ff;
  color:#2368aa;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.toolbar .input{
  max-width:280px;
}

.empty{
  padding:35px;
  text-align:center;
  color:var(--muted);
}

.loading{
  padding:30px;
  text-align:center;
  color:var(--muted);
}

.notice{
  padding:13px;
  background:#eef7f0;
  border:1px solid #d6ead9;
  border-radius:10px;
  font-size:12px;
  margin-bottom:15px;
}

.notice.error{
  background:#fff0f0;
  border-color:#ffd4d4;
  color:var(--red);
}

.progress{
  height:7px;
  background:#edf1ec;
  border-radius:20px;
  overflow:hidden;
}

.progress i{
  display:block;
  height:100%;
  background:var(--green);
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:500;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  background:#fff;
  width:100%;
  max-width:900px;
  max-height:92vh;
  overflow:auto;
  border-radius:18px;
  box-shadow:0 20px 70px rgba(0,0,0,.25);
}

.modal-head{
  padding:17px 20px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  background:#fff;
  z-index:2;
}

.modal-body{
  padding:20px;
}

.close-btn{
  border:0;
  background:#f1f3ef;
  width:34px;
  height:34px;
  border-radius:50%;
  font-size:20px;
}

.toast{
  position:fixed;
  right:20px;
  bottom:20px;
  background:#173d29;
  color:#fff;
  padding:13px 17px;
  border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  opacity:0;
  transform:translateY(20px);
  pointer-events:none;
  transition:.25s;
  z-index:1000;
  max-width:350px;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translateY(0);
}

.status-flow{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.status-btn{
  border:1px solid var(--border);
  background:#fff;
  padding:7px 9px;
  border-radius:8px;
  font-size:10px;
}

.status-btn.active{
  background:var(--green);
  color:#fff;
  border-color:var(--green);
}

.permission-box{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.permission-item{
  border:1px solid var(--border);
  border-radius:9px;
  padding:10px;
  display:flex;
  gap:8px;
  align-items:center;
  font-size:12px;
}

.checkbox{
  width:16px;
  height:16px;
}

.json-box{
  background:#111a15;
  color:#d9eee0;
  padding:15px;
  border-radius:10px;
  white-space:pre-wrap;
  word-break:break-word;
  font-size:11px;
  max-height:300px;
  overflow:auto;
}

.print-only{
  display:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1200px){
  .kpi-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .dashboard-grid{
    grid-template-columns:1fr;
  }
}

@media(max-width:850px){
  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
  }

  .top-search{
    width:180px;
  }

  .content{
    padding:15px;
  }

  .kpi-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-2,
  .grid-3,
  .grid-4{
    grid-template-columns:1fr;
  }

  .permission-box{
    grid-template-columns:1fr 1fr;
  }

  .identity{
    display:none;
  }
}

@media(max-width:500px){
  .topbar{
    padding:0 12px;
  }

  .top-search{
    width:130px;
  }

  .page-head{
    align-items:flex-start;
    flex-direction:column;
  }

  .kpi-grid{
    grid-template-columns:1fr 1fr;
    gap:9px;
  }

  .kpi{
    padding:13px;
  }

  .kpi-value{
    font-size:18px;
  }

  .permission-box{
    grid-template-columns:1fr;
  }
}

/* ================= PRINT ================= */

@media print{
  body{
    background:#fff;
  }

  .sidebar,
  .topbar,
  .no-print,
  .modal-backdrop{
    display:none!important;
  }

  .main{
    margin:0;
    width:100%;
  }

  .content{
    padding:0;
  }

  .print-only{
    display:block;
  }
}
</style>
</head>

const $ = id =>
  document.getElementById(id);


function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  const n = Number(value || 0);

  return "৳" + n.toLocaleString(
    "en-BD",
    {
      maximumFractionDigits:2
    }
  );

}


function number(value){

  const n = Number(value || 0);

  return n.toLocaleString(
    "en-BD",
    {
      maximumFractionDigits:2
    }
  );

}


function timestampMs(value){

  if(!value) return 0;

  if(
    typeof value.toMillis === "function"
  ){

    return value.toMillis();

  }

  if(
    typeof value === "object" &&
    value.seconds
  ){

    return Number(value.seconds) * 1000;

  }

  const t =
    new Date(value).getTime();

  return isNaN(t) ? 0 : t;

}


function dateText(value){

  const ms = timestampMs(value);

  if(!ms) return "—";

  return new Date(ms).toLocaleString(
    "en-BD",
    {
      dateStyle:"medium",
      timeStyle:"short"
    }
  );

}


function toast(message){

  const el = $("toast");

  el.textContent = message;

  el.classList.add("show");

  clearTimeout(
    window.__toastTimer
  );

  window.__toastTimer =
    setTimeout(
      ()=>{
        el.classList.remove("show");
      },
      3200
    );

}


function openModal(title,html){

  $("modalTitle").textContent =
    title;

  $("modalBody").innerHTML =
    html;

  $("modalBackdrop")
    .classList.add("show");

}


function closeModal(){

  $("modalBackdrop")

}


function normalizeRole(role){

  return String(role || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,"_");

}

function isSuperAdmin(){

  if(!currentProfile)
    return false;

  const r =
    normalizeRole(
      currentProfile.role
    );

  return r === "super_admin";

}


function can(permission){

  if(isSuperAdmin())
    return true;

  return Boolean(
    currentProfile &&
    currentProfile.permissions &&
    currentProfile.permissions[permission] === true
  );

}

/* =========================================================
   AUTH STATE
========================================================= */

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      currentUser = null;
      currentProfile = null;

      showLogin();

      return;

    }

    currentUser = user;

    try{

      const profileRef =
        doc(
          db,
          "users",
          user.uid
        );

      const snap =
        await getDoc(profileRef);

      if(!snap.exists()){

        await signOut(auth);

        showLogin();

        $("loginError").textContent =
          "এই Firebase account-এর Admin profile পাওয়া যায়নি।";

        return;

      }

      currentProfile = {

        uid:user.uid,

        email:user.email || "",

        ...snap.data()

      };

      const role =
        normalizeRole(
          currentProfile.role
        );

      const status =
        String(
          currentProfile.status || ""
        ).toLowerCase();

      if(
        role === "customer"
        ||
        ![
          "active",
          "Active".toLowerCase()
        ].includes(status)
      ){

        await signOut(auth);

        showLogin();

        $("loginError").textContent =
          "এই account-এর Admin Panel access নেই।";

        return;

      }

      if(
        ![
          "super_admin",
          "order_manager",
          "product_manager",
          "inventory_manager",
          "finance",
          "accountant",
          "delivery_manager",
          "customer_support",
          "marketing_manager"
        ].includes(role)
      ){

        await signOut(auth);

        showLogin();

        $("loginError").textContent =
          "আপনার Staff role Admin Panel-এর জন্য অনুমোদিত নয়।";

        return;

      }

      showApp();

      updateIdentity();

      await loadAllData();

      openPage(
        currentPage || "dashboard"
      );

    }catch(error){

      console.error(
        "AUTH PROFILE ERROR:",
        error
      );

      await signOut(auth);

      showLogin();

      $("loginError").textContent =
        "Admin profile verify করা যায়নি: " +
        error.message;

    }

  }
);

async function loadCollection(name){

  try{

    const snap =
      await getDocs(
        collection(
          db,
          name
        )
      );

    return snap.docs.map(
      d => ({
        id:d.id,
        ...d.data()
      })
    );

  }catch(error){

    console.warn(
      "Collection load failed:",
      name,
      error
    );

    return [];

  }

}


async function loadAllData(){

  showLoading();

  const results =
    await Promise.all(
      COLLECTIONS.map(
        name =>
          loadCollection(name)
      )
    );

  COLLECTIONS.forEach(
    (name,index)=>{
      allData[name] =
        results[index];
    }
  );

  try{

    const settingSnap =
      await getDoc(
        doc(
          db,
          "settings",
          "platform"
        )
      );

    if(settingSnap.exists()){

      platformSettings = {

        ...platformSettings,

        ...settingSnap.data()

      };

    }

  }catch(error){

    console.warn(
      "Platform settings:",
      error
    );

  }

}

function renderDashboard(){

    allData.orders || [];

    allData.expenses || [];

    allData.product_variants || [];

  const delivered =
    orders.filter(
      o =>
        String(
          o.status ||
          o.orderStatus ||
          ""
        ).toLowerCase()
        === "delivered"
    );

  const cancelled =
    orders.filter(
      o =>
        String(
          o.status ||
          o.orderStatus ||
          ""
        ).toLowerCase()
        === "cancelled"
    );

  const pending =
    orders.filter(
      o =>
        ![
          "delivered",
          "cancelled"
        ].includes(
          String(
            o.status ||
            o.orderStatus ||
            ""
          ).toLowerCase()
        )
    );

  const sales =
    delivered.reduce(
      (sum,o)=>
        sum +
        Number(
          o.total ??
          o.value ??
          0
        ),
      0
    );

  const deliveryIncome =
    orders.reduce(
      (sum,o)=>
        sum +
        Number(
          o.deliveryCharge || 0
        ),
      0
    );

  const platformIncome =
    orders.reduce(
      (sum,o)=>
        sum +
        Number(
          o.platformCharge || 0
        ),
      0
    );

  const expenseTotal =
    expenses.reduce(
      (sum,e)=>
        sum +
        Number(
          e.amount || 0
        ),
      0

  const grossProfit =
    sales -
    orders.reduce(
      (sum,o)=>
        sum +
        Number(

          0

      0
    );

  const netProfit =

  return (
    o.customerName ||
    o.customer?.name ||
    o.name ||
    "Customer"
  );

}


function customerMobile(o){

  return (
    o.customerMobile ||
    o.mobile ||
    o.phone ||
    o.customer?.phone ||
    "—"
  );

}


function customerAddress(o){

  return (
    o.deliveryAddress ||
    o.address ||
    o.customerAddress ||
    o.customer?.address ||
    "—"
  );

}


function orderStatus(o){

  return (
    o.status ||
    o.orderStatus ||
    "Order Placed"
  );

}


function orderTotal(o){

  return Number(
    o.total ??
    o.value ??
    o.grandTotal ??
    0
  );

}


function orderItems(o){

  return (
    o.items ||
    o.products ||
    o.orderItems ||
    []
  );

}


function statusBadge(status){

  const s =
    String(status || "");

  let cls = "";

  if(
    s === "Delivered"
  ){
    cls = "";
  }

  else if(
    [
      "Cancelled",
      "Failed"
    ].includes(s)
  ){
    cls = "red";
  }

  else if(
    [
      "Pending",
      "Processing",
      "Payment Verification"
    ].includes(s)
  ){
    cls = "orange";
  }

  else if(
    [
      "Out for Delivery",
      "Rider Assigned"
    ].includes(s)
  ){
    cls = "blue";
  }

  return `
    <span class="badge ${cls}">
      ${esc(s)}
    </span>
  `;

}

window.__updateOrderStatus =
async function(id,status){

  if(
    !can("orders_edit") &&
    !can("orders")
  ){

    toast(
      "আপনার Orders Edit permission নেই।"
    );

    return;

  }

  try{

    await updateDoc(
      doc(
        db,
        "orders",
        id
      ),
      {
        status,
        orderStatus:status,
        updatedAt:serverTimestamp()
      }
    );

    await writeAudit(
      "update",
      "orders",
      id,
      {
        status
      }
    );

    toast(
      "Order status updated."
    );

    await loadAllData();

    window.__viewOrder(id);

  }catch(error){

    console.error(error);

    toast(
      "Status update failed: " +
      error.message
    );

  }

};

function formatCell(value){

  if(
    value === null ||
    value === undefined
  ){

    return "—";

  }

  if(
    typeof value === "object"
  ){

    return esc(
      JSON.stringify(
        value
      )
    );

  }

  return esc(
    String(value)
  );

}

function genericForm(
  key,
  row=null
){

  const config =
    MODULE_CONFIG[key];

  const editing =
    Boolean(row);

  if(
    editing &&
    !can(config.edit)
  ){

    toast(
      "Edit permission নেই।"
    );

    return;

  }

  if(
    !editing &&
    !can(config.create)
  ){

    toast(
      "Create permission নেই।"
    );

    return;

  }

  openModal(
    editing
    ? "Edit " + config.title
    : "Add " + config.title,

    `

      ${
        config.fields
          .map(
            f =>
            `
            <div class="field">

              <label>
                ${esc(f[1])}
              </label>

              <input
                class="input generic-field"
                data-field="${esc(f[0])}"
                value="${esc(
                  row?.[f[0]] ?? ""
                )}"
              >

            </div>
            `
          ).join("")
      }


      <div class="actions">

        <button
          class="primary"
          id="genericSave"
        >
          Save
        </button>

        <button
          class="secondary"
          onclick="window.__closeModal()"
        >
          Cancel
        </button>

      </div>

    `
  );


  $("genericSave")
    .onclick =
    async ()=>{

      const data = {};

      document
        .querySelectorAll(
          ".generic-field"
        )
        .forEach(
          input => {

            data[
              input.dataset.field
            ] =
              input.value;

          }
        );

      data.updatedAt =
        serverTimestamp();

      try{

        if(editing){

          await updateDoc(
            doc(
              db,
              config.collection,
              row.id
            ),
            data
          );

          await writeAudit(
            "update",
            config.collection,
            row.id,
            data
          );

        }else{

          const ref =
            await addDoc(
              collection(
                db,
                config.collection
              ),
              {
                ...data,
                createdAt:
                  serverTimestamp()
              }
            );

          await writeAudit(
            "create",
            config.collection,
            ref.id,
            data
          );

        }

        closeModal();

        await loadAllData();

        renderGeneric(key);

        toast(
          "Saved successfully."
        );

      }catch(error){

        toast(
          "Save failed: " +
          error.message
        );

      }

    };

}

    `
  );


  $("createStaff")
    .onclick =
    async ()=>{

      const name =
        $("staffName")
          .value
          .trim();

      const email =
        $("staffEmail")
          .value
          .trim();

      const password =
        $("staffPassword")
          .value;

      const role =
        $("staffRole")
          .value;

      const error =
        $("staffError");

      if(
        !name ||
        !email ||
        !password
      ){

        error.textContent =
          "সব তথ্য পূরণ করুন।";

        return;

      }

      if(
        password.length < 6
      ){

        error.textContent =
          "Password কমপক্ষে 6 characters হতে হবে।";

        return;

      }


      const permissions = {};

      document
        .querySelectorAll(
          ".staff-permission"
        )
        .forEach(
          checkbox => {

            permissions[
              checkbox.value
            ] =
              checkbox.checked;

          }
        );


      const btn =
        $("createStaff");

      btn.disabled = true;

      btn.textContent =
        "Creating...";


      try{

        if(!staffAuth){

          throw new Error(
            "Secondary Firebase Auth initialize হয়নি।"
          );

        }


        /*
          IMPORTANT:
          Secondary Auth creates staff account.
          Current Super Admin session remains active.
        */

        const result =
          await createUserWithEmailAndPassword(
            staffAuth,
            email,
            password
          );

        const newUid =
          result.user.uid;


        await setDoc(
          doc(
            db,
            "users",
            newUid
          ),
          {

            name,

            email,

            role,

            status:"active",

            accountType:"staff",

            permissions,

            createdAt:
              serverTimestamp(),

            createdBy:
              currentUser.uid

          }
        );


        await writeAudit(
          "create",
          "users",
          newUid,
          {
            name,
            email,
            role
          }
        );


        /*
          Sign secondary account out.
          Primary Admin remains logged in.
        */

        await signOut(
          staffAuth
        );


        closeModal();

        await loadAllData();

        renderStaff();

        toast(
          "Staff account created successfully."
        );


      }catch(error){

        console.error(error);

        error.textContent =
          error?.message ||
          "Staff account creation failed.";

        btn.disabled = false;

        btn.textContent =
          "Create Staff Account";

      }

    };

}

function reportDateInRange(
  value,
  start,
  end
){

  const ms =
    timestampMs(value);

  if(!ms) return false;

  const date =
    new Date(ms);

  const d =
    date.toISOString()
      .slice(0,10);

  return (
    (!start || d >= start) &&
    (!end || d <= end)
  );

}


function getFilteredOrders(){

  return allData.orders.filter(

        o.createdAt ||
        o.date,
        start,
        end
      )
  );

}

function exportReportCSV(){

  const orders =
    getFilteredOrders();

  const headers = [
    "Order Code",
    "Customer",
    "Mobile",
    "Status",
    "Payment Status",
    "Delivery Charge",
    "Platform Charge",
    "Total",
    "Date"
  ];

  const rows =
    orders.map(
      o => [

        orderCode(o),

        customerName(o),

        customerMobile(o),

        orderStatus(o),

        o.paymentStatus || "",

        o.deliveryCharge || 0,

        o.platformCharge || 0,

        orderTotal(o),

        dateText(
          o.createdAt ||
          o.date
        )

      ]
    );


  const csv = [

    headers,

    ...rows

  ]
  .map(
    row =>
      row.map(
        x =>
          `"${String(x ?? "")
            .replace(/"/g,'""')}"`
      ).join(",")
  )
  .join("\n");


  const blob =
    new Blob(
      [csv],
      {
        type:"text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;

  a.download =
    "naturebite-orders-report.csv";

  a.click();

  URL.revokeObjectURL(url);

}
