<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nature bite — Admin Panel</title>

<style>
:root{
  --green:#2E7D32;
  --green2:#388E3C;
  --sage:#A5C18E;
  --cream:#F5F2E8;
  --brown:#5D4037;
  --red:#c62828;
  --orange:#ef6c00;
  --blue:#1565c0;
  --text:#263238;
  --muted:#6b7280;
  --border:#e2e8e3;
  --white:#fff;
  --shadow:0 5px 22px rgba(0,0,0,.07);
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f4f7f3;
  color:var(--text);
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:255px;
  background:#173d1b;
  color:#fff;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow:auto;
  z-index:50;
}

.logo{
  padding:22px 18px;
  font-size:24px;
  font-weight:800;
  border-bottom:1px solid rgba(255,255,255,.12);
}

.logo small{
  display:block;
  font-size:11px;
  color:#b8d5ba;
  margin-top:4px;
}

.nav{
  padding:10px;
}

.nav button{
  width:100%;
  text-align:left;
  border:0;
  background:transparent;
  color:#dcebdd;
  padding:12px 14px;
  border-radius:9px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#2E7D32;
  color:#fff;
}

.nav-title{
  font-size:10px;
  color:#91ae94;
  padding:14px 10px 5px;
  text-transform:uppercase;
}

/* MAIN */

.main{
  margin-left:255px;
  width:calc(100% - 255px);
  min-height:100vh;
}

.topbar{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:13px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:30;
}

.mobile-menu{
  display:none;
}

.content{
  padding:20px;
}

.page-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.page-title h1{
  margin:0;
  font-size:25px;
}

.page-title p{
  margin:5px 0 0;
  color:var(--muted);
  font-size:13px;
}

/* CARDS */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px;
}

.grid-3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.grid-2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:14px;
  padding:17px;
  box-shadow:var(--shadow);
}

.stat-title{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-size:26px;
  font-weight:800;
  margin:8px 0;
  color:var(--green);
}

.stat-foot{
  font-size:12px;
  color:var(--muted);
}

/* BUTTON */

.btn{
  border:0;
  background:var(--green);
  color:#fff;
  padding:9px 13px;
  border-radius:8px;
  font-weight:700;
  margin:2px;
}

.btn:hover{
  opacity:.9;
}

.btn.secondary{
  background:var(--brown);
}

.btn.gray{
  background:#607d8b;
}

.btn.blue{
  background:var(--blue);
}

.btn.orange{
  background:var(--orange);
}

.btn.red{
  background:var(--red);
}

.btn.light{
  background:#e8f1e8;
  color:var(--green);
}

.btn.small{
  padding:6px 9px;
  font-size:12px;
}

/* TABLE */

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:11px 10px;
  border-bottom:1px solid #edf0ed;
  text-align:left;
  font-size:13px;
}

th{
  background:#f7faf7;
  color:#455a64;
}

tr:hover td{
  background:#fbfdfb;
}

/* BADGE */

.badge{
  display:inline-block;
  padding:4px 8px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  background:#e8f5e9;
  color:#256029;
}

.badge.red{
  background:#ffebee;
  color:#b71c1c;
}

.badge.orange{
  background:#fff3e0;
  color:#e65100;
}

.badge.blue{
  background:#e3f2fd;
  color:#0d47a1;
}

/* FORM */

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.form-group{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.form-group.full{
  grid-column:1/-1;
}

label{
  font-size:12px;
  font-weight:700;
  color:#455a64;
}

input,
select,
textarea{
  width:100%;
  border:1px solid #d8e0d9;
  padding:10px;
  border-radius:8px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
}

/* TOGGLE */

.toggle{
  width:48px;
  height:25px;
  border:0;
  background:#cbd5d0;
  border-radius:20px;
  position:relative;
  transition:.2s;
}

.toggle:after{
  content:"";
  width:19px;
  height:19px;
  border-radius:50%;
  background:#fff;
  position:absolute;
  top:3px;
  left:3px;
  transition:.2s;
}

.toggle.on{
  background:var(--green);
}

.toggle.on:after{
  left:26px;
}

/* TABS */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:15px;
}

.tab{
  border:1px solid var(--border);
  background:#fff;
  padding:8px 12px;
  border-radius:8px;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:#fff;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(700px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:15px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.modal-head h2{
  margin:0;
}

.close{
  border:0;
  background:#eee;
  width:35px;
  height:35px;
  border-radius:50%;
}

/* TOAST */

.toast{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#263238;
  color:#fff;
  padding:12px 17px;
  border-radius:9px;
  display:none;
  z-index:999;
}

/* MOBILE */

@media(max-width:900px){

  .sidebar{
    transform:translateX(-100%);
    transition:.25s;
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .main{
    margin-left:0;
    width:100%;
  }

  .mobile-menu{
    display:block;
    border:0;
    background:#e8f5e9;
    color:var(--green);
    padding:8px 11px;
    border-radius:8px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .grid-3{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .content{
    padding:12px;
  }

  .topbar{
    padding:10px 12px;
  }

  .grid,
  .grid-2{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .page-title{
    align-items:flex-start;
    flex-direction:column;
  }

}

/* PRINT */

@media print{

  .sidebar,
  .topbar,
  .no-print,
  .btn,
  button{
    display:none!important;
  }

  .main{
    margin:0;
    width:100%;
  }

  .content{
    padding:0;
  }

  .card{
    box-shadow:none;
    border:1px solid #ddd;
  }

}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

<div class="logo">
Nature bite
<small>Business Admin Panel</small>
</div>

<div class="nav">

<div class="nav-title">Main</div>

<button onclick="showPage('dashboard')">📊 Dashboard</button>
<button onclick="showPage('orders')">🛒 Orders</button>
<button onclick="showPage('products')">📦 Products</button>
<button onclick="showPage('inventory')">🏷 Inventory</button>
<button onclick="showPage('customers')">👥 Customers</button>

<div class="nav-title">Delivery</div>

<button onclick="showPage('riders')">🚴 Riders</button>
<button onclick="showPage('partners')">🚚 Delivery Partners</button>
<button onclick="showPage('challan')">🧾 Chalan</button>

<div class="nav-title">Finance</div>

<button onclick="showPage('payments')">💳 Payments</button>
<button onclick="showPage('refunds')">↩ Refunds</button>
<button onclick="showPage('expenses')">💰 Expenses</button>

<div class="nav-title">Marketing</div>

<button onclick="showPage('offers')">🎟 Offers & Coupons</button>
<button onclick="showPage('lucky')">🎡 Lucky Wheel</button>
<button onclick="showPage('draw')">🎁 Lucky Draw</button>

<div class="nav-title">Customer</div>

<button onclick="showPage('reviews')">⭐ Reviews</button>
<button onclick="showPage('support')">🎧 Support</button>

<div class="nav-title">Business Analytics</div>

<button onclick="showPage('financeAnalytics')">📈 Financial Analytics</button>
<button onclick="showPage('growth')">🚀 Growth & Performance</button>

<div class="nav-title">Management</div>

<button onclick="showPage('reports')">📄 Reports</button>
<button onclick="showPage('staff')">👨‍💼 Staff & Permissions</button>
<button onclick="showPage('settings')">⚙ Customer Panel Settings</button>
<button onclick="showPage('audit')">🔐 Audit Logs</button>

</div>
</aside>

<main class="main">

<header class="topbar">

<div>
<button class="mobile-menu" onclick="toggleSidebar()">☰</button>
<strong id="topTitle">Dashboard</strong>
</div>

<div>
<span class="badge">MAIN ADMIN</span>
</div>

</header>

<section class="content" id="content"></section>

</main>

</div>

<div class="modal" id="modal">

<div class="modal-box">

<div class="modal-head">

<h2 id="modalTitle"></h2>

<button class="close" onclick="closeModal()">×</button>

</div>

<div id="modalBody"></div>

</div>

</div>

<div class="toast" id="toast"></div>


<script>

/* =========================================================
   NATURE BITE ADMIN DATABASE
========================================================= */

const DB_KEY="nature_bite_admin_database_v5";

const defaultDB={

settings:{
 brand:"Nature bite",

 customerPanel:true,
 products:true,
 cart:true,
 checkout:true,
 orders:true,
 tracking:true,
 wishlist:true,
 offers:true,
 coupons:true,
 reviews:true,
 notifications:true,
 support:true,

 luckyWheel:true,
 luckyDraw:true,

 bkash:true,
 nagad:true,
 cod:true,

 advanceDelivery:true,
 platformChargeEnabled:true,

 deliveryCharge:60,
 platformCharge:10,

 bkashNumber:"01XXXXXXXXX",
 nagadNumber:"01XXXXXXXXX",

 confirmDeliveryLevel:"OTP + Photo",

 futureAPI:false
},

products:[
 {
 id:"P001",
 name:"Granola Bar",
 variant:"30g",
 price:120,
 cost:65,
 stock:50,
 active:true
 },
 {
 id:"P002",
 name:"Peanut Energy Bite",
 variant:"6 pcs",
 price:150,
 cost:80,
 stock:40,
 active:true
 }
],

customers:[
 {
 id:"C001",
 name:"Demo Customer",
 mobile:"01XXXXXXXXX",
 orders:3,
 spent:850,
 active:true
 }
],

orders:[
 {
 id:"NB10001",
 customer:"Demo Customer",
 mobile:"01XXXXXXXXX",
 total:850,
 status:"Confirmed",
 payment:"Delivery Charge Paid",
 paymentStatus:"Verified",
 rider:""
 }
],

riders:[],

partners:[
 {id:"DP001",name:"Nature Bite Delivery",active:true},
 {id:"DP002",name:"Pathao",active:false},
 {id:"DP003",name:"Steadfast",active:false},
 {id:"DP004",name:"CarryBee",active:false},
 {id:"DP005",name:"RedX",active:false}
],

offers:[],

staff:[],

support:[],

reviews:[],

refunds:[],

expenses:[],

audit:[],

metrics:{
 revenue:125000,
 productCost:60000,
 deliveryCost:15000,
 marketing:12000,
 otherCost:8000,

 customers:180,
 newCustomers:50,
 repeatCustomers:72,
 orders:240,
 delivered:210,

 visits:4200,
 addToCart:840,
 checkout:420,

 nps:62,

 workingHours:160
}

};


/* =========================================================
   DATABASE
========================================================= */

function db(){

 let x=localStorage.getItem(DB_KEY);

 if(!x){
   localStorage.setItem(DB_KEY,JSON.stringify(defaultDB));
   return structuredClone(defaultDB);
 }

 try{
   return JSON.parse(x);
 }catch(e){
   localStorage.setItem(DB_KEY,JSON.stringify(defaultDB));
   return structuredClone(defaultDB);
 }

}

function saveDB(x){
 localStorage.setItem(DB_KEY,JSON.stringify(x));
}

function uid(prefix){
 return prefix+"-"+Date.now()+"-"+Math.random().toString(36).slice(2,7);
}

function money(n){
 return "৳"+Number(n||0).toLocaleString("en-BD");
}

function esc(x){
 return String(x??"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");
}

function toast(message){

 const t=document.getElementById("toast");

 t.innerText=message;
 t.style.display="block";

 clearTimeout(window.toastTimer);

 window.toastTimer=setTimeout(()=>{
   t.style.display="none";
 },2500);

}

function log(action,detail){

 const d=db();

 d.audit.unshift({
   id:uid("LOG"),
   time:new Date().toLocaleString(),
   action,
   detail
 });

 d.audit=d.audit.slice(0,500);

 saveDB(d);

}


/* =========================================================
   NAVIGATION
========================================================= */

const pageNames={
 dashboard:"Dashboard",
 orders:"Orders",
 products:"Products",
 inventory:"Inventory",
 customers:"Customers",
 riders:"Riders",
 partners:"Delivery Partners",
 payments:"Payments",
 refunds:"Refunds",
 expenses:"Expenses",
 offers:"Offers & Coupons",
 lucky:"Lucky Wheel",
 draw:"Lucky Draw",
 reviews:"Reviews",
 support:"Support",
 challan:"Delivery Chalan",
 financeAnalytics:"Financial Analytics",
 growth:"Growth & Performance",
 reports:"Reports",
 staff:"Staff & Permissions",
 settings:"Customer Panel Settings",
 audit:"Audit Logs"
};

function showPage(page){

 document.getElementById("topTitle").innerText=pageNames[page]||page;

 document.querySelectorAll(".nav button").forEach(x=>{
   x.classList.remove("active");
 });

 renderPage(page);

 document.getElementById("sidebar").classList.remove("open");

}

function toggleSidebar(){
 document.getElementById("sidebar").classList.toggle("open");
}


/* =========================================================
   PAGE RENDER
========================================================= */

function renderPage(page){

 const area=document.getElementById("content");

 const pages={
   dashboard:dashboardPage,
   orders:ordersPage,
   products:productsPage,
   inventory:inventoryPage,
   customers:customersPage,
   riders:ridersPage,
   partners:partnersPage,
   payments:paymentsPage,
   refunds:refundsPage,
   expenses:expensesPage,
   offers:offersPage,
   lucky:luckyPage,
   draw:drawPage,
   reviews:reviewsPage,
   support:supportPage,
   challan:challanPage,
   financeAnalytics:financeAnalyticsPage,
   growth:growthPage,
   reports:reportsPage,
   staff:staffPage,
   settings:settingsPage,
   audit:auditPage
 };

 area.innerHTML=(pages[page]||dashboardPage)();

}


/* =========================================================
   DASHBOARD
========================================================= */

function dashboardPage(){

 const d=db();
 const m=d.metrics;

 const profit=
 m.revenue-
 m.productCost-
 m.deliveryCost-
 m.marketing-
 m.otherCost;

 return `

 <div class="page-title">

 <div>
 <h1>Business Dashboard</h1>
 <p>Nature bite business control center</p>
 </div>

 <div>
 <button class="btn" onclick="showPage('orders')">+ Order</button>
 <button class="btn secondary" onclick="window.print()">🖨 Print</button>
 </div>

 </div>


 <div class="grid">

 ${stat("Total Sales",money(m.revenue),"Revenue")}

 ${stat("Orders",m.orders,"Total orders")}

 ${stat("Customers",m.customers,"Registered customers")}

 ${stat("Delivered",m.delivered,"Completed orders")}

 </div>


 <div class="grid">

 ${stat("Product Cost",money(m.productCost),"COGS")}

 ${stat("Delivery Cost",money(m.deliveryCost),"Delivery")}

 ${stat("Marketing",money(m.marketing),"Marketing expense")}

 ${stat("Net Profit",money(profit),"Estimated")}

 </div>


 <div class="grid-2">

 <div class="card">

 <h3>Quick Actions</h3>

 <button class="btn" onclick="addProduct()">+ Product</button>
 <button class="btn" onclick="addRider()">+ Rider</button>
 <button class="btn" onclick="addStaff()">+ Staff</button>
 <button class="btn" onclick="addOffer()">+ Coupon</button>
 <button class="btn blue" onclick="generateReport()">Monthly Report</button>
 <button class="btn secondary" onclick="showPage('settings')">Customer Settings</button>

 </div>


 <div class="card">

 <h3>System Status</h3>

 <p>
 Customer Panel:
 ${d.settings.customerPanel
 ?badge("Active")
 :badge("Inactive","red")}
 </p>

 <p>
 Checkout:
 ${d.settings.checkout
 ?badge("Active")
 :badge("Inactive","red")}
 </p>

 <p>
 API:
 ${d.settings.futureAPI
 ?badge("Configured")
 :badge("Manual Mode")}
 </p>

 </div>

 </div>
 `;

}


function stat(title,value,foot){

 return `
 <div class="card">

 <div class="stat-title">${title}</div>

 <div class="stat-value">${value}</div>

 <div class="stat-foot">${foot}</div>

 </div>
 `;

}

function badge(text,type=""){

 return `<span class="badge ${type}">${esc(text)}</span>`;

}


/* =========================================================
   ORDERS
========================================================= */

function ordersPage(){

 const d=db();

 return `

 <div class="page-title">

 <div>
 <h1>Order Management</h1>
 <p>Customer orders, payment status, delivery status</p>
 </div>

 <div>
 <button class="btn" onclick="addOrder()">+ Add Order</button>
 <button class="btn gray" onclick="window.print()">🖨 Print</button>
 </div>

 </div>


 <div class="card">

 <div class="table-wrap">

 <table>

 <thead>

 <tr>
 <th>Order</th>
 <th>Customer</th>
 <th>Total</th>
 <th>Payment</th>
 <th>Status</th>
 <th>Rider</th>
 <th>Actions</th>
 </tr>

 </thead>

 <tbody>

 ${d.orders.map(o=>`

 <tr>

 <td><b>${esc(o.id)}</b></td>

 <td>
 ${esc(o.customer)}
 <br>
 <small>${esc(o.mobile)}</small>
 </td>

 <td>${money(o.total)}</td>

 <td>
 ${badge(o.paymentStatus||"Pending",
 o.paymentStatus==="Verified"?"":"orange")}
 </td>

 <td>${badge(o.status)}</td>

 <td>${esc(o.rider||"Not Assigned")}</td>

 <td>

 <button class="btn small"
 onclick="changeOrderStatus('${o.id}')">
 Status
 </button>

 <button class="btn small blue"
 onclick="printOrderLabel('${o.id}')">
 🖨 Label
 </button>

 <button class="btn small gray"
 onclick="viewOrder('${o.id}')">
 View
 </button>

 </td>

 </tr>

 `).join("")}

 </tbody>

 </table>

 </div>

 </div>

 `;

}


function addOrder(){

 const d=db();

 const customer=prompt("Customer name:");

 if(!customer)return;

 const total=Number(prompt("Order total:",500));

 const o={
   id:uid("NB"),
   customer,
   mobile:prompt("Mobile:")||"",
   total,
   status:"Pending",
   payment:"Delivery Charge",
   paymentStatus:"Pending",
   rider:""
 };

 d.orders.unshift(o);

 saveDB(d);

 log("Order Created",o.id);

 toast("Order created");

 showPage("orders");

}


function changeOrderStatus(id){

 const d=db();

 const o=d.orders.find(x=>x.id===id);

 if(!o)return;

 const statuses=[
 "Pending",
 "Confirmed",
 "Preparing",
 "Ready",
 "Rider Assigned",
 "Picked Up",
 "On the Way",
 "Delivered",
 "Delivery Confirmed",
 "Cancelled",
 "Returned",
 "Refund Requested",
 "Refunded"
 ];

 const value=prompt(
 "Enter status:\n\n"+
 statuses.join(" / "),
 o.status
 );

 if(!value)return;

 o.status=value;

 if(value==="Delivered"){
   o.deliveryConfirmed=false;
 }

 saveDB(d);

 log("Order Status Changed",id+" → "+value);

 toast("Order updated");

 showPage("orders");

}


function viewOrder(id){

 const d=db();

 const o=d.orders.find(x=>x.id===id);

 if(!o)return;

 openModal(
 "Order "+o.id,
 `
 <div class="card">

 <p><b>Customer:</b> ${esc(o.customer)}</p>
 <p><b>Mobile:</b> ${esc(o.mobile)}</p>
 <p><b>Total:</b> ${money(o.total)}</p>
 <p><b>Payment:</b> ${esc(o.payment)}</p>
 <p><b>Payment Status:</b> ${esc(o.paymentStatus)}</p>
 <p><b>Status:</b> ${esc(o.status)}</p>
 <p><b>Rider:</b> ${esc(o.rider||"Not Assigned")}</p>

 <button class="btn" onclick="verifyOrderPayment('${id}')">
 Verify Payment
 </button>

 <button class="btn secondary"
 onclick="confirmDelivery('${id}')">
 Confirm Delivery
 </button>

 </div>
 `
 );

}


function verifyOrderPayment(id){

 const d=db();

 const o=d.orders.find(x=>x.id===id);

 if(!o)return;

 o.paymentStatus="Verified";

 saveDB(d);

function financeMetricCard(title,value,formula){

 `;

function financeTab(type){

 const d=db();
 const m=d.metrics;

 const totalCost=
 m.productCost+
 m.deliveryCost+
 m.marketing+
 m.otherCost;

 const profit=m.revenue-totalCost;

 let title="";
 let value="";
 let formula="";

 if(type==="roi"){
   title="ROI";
   value=(profit/Math.max(totalCost,1)*100).toFixed(2)+"%";
   formula="(Revenue − Total Cost) ÷ Total Cost × 100";
 }

 if(type==="cash"){
   title="Cash Flow";
   value=money(profit);
   formula="Revenue − Product Cost − Delivery − Marketing − Other Cost";
 }

 if(type==="cac"){
   const cac=m.marketing/Math.max(m.newCustomers,1);
   const ltv=(m.revenue/Math.max(m.customers,1))*
   Math.max(m.repeatCustomers/m.customers,1);

   title="CAC & LTV";
   value="CAC "+money(cac)+" | LTV "+money(ltv);
   formula="CAC = Marketing ÷ New Customers";
 }

 if(type==="break"){
   title="Break-even Point";
   value=money(totalCost);
   formula="Approximate revenue required to cover recorded costs";
 }

 if(type==="time"){
   title="Value Your Time";
   value=money(profit/Math.max(m.workingHours,1))+"/hour";
   formula="Net Profit ÷ Working Hours";
 }

 document.getElementById("financeTabContent").innerHTML=
 financeMetricCard(title,value,formula);

}

 input.accept=".json";

 input.onchange=e=>{

  const file=e.target.files[0];

  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{

   try{

    const data=JSON.parse(reader.result);

    localStorage.setItem(DB_KEY,JSON.stringify(data));

    log("Database Imported","JSON backup");

    toast("Backup imported");

    showPage("dashboard");

   }catch(err){

    toast("Invalid backup file");

   }

  };

  reader.readAsText(file);

 };

 input.click();

}


/* =========================================================
   KEYBOARD / MODAL
========================================================= */

document.getElementById("modal").addEventListener(
 "click",
 e=>{
   if(e.target.id==="modal")closeModal();
 }
);


/* =========================================================
   INIT
========================================================= */

document.addEventListener(
 "DOMContentLoaded",
 ()=>{

   showPage("dashboard");

 }
);

</script>
