<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nature bite — Admin Panel</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
:root{
  --green:#2E7D32;
  --green2:#388E3C;
  --sage:#A5C18E;
  --cream:#F5F2E8;
  --brown:#5D4037;
  --danger:#C62828;
  --warning:#EF6C00;
  --blue:#1565C0;
  --text:#263238;
  --muted:#78909C;
  --white:#fff;
  --border:#e5e7eb;
  --shadow:0 8px 30px rgba(0,0,0,.07);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f6f8f5;
  color:var(--text);
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}

.app{
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:260px;
  background:#173f1d;
  color:white;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  overflow:auto;
  z-index:50;
  transition:.25s;
}

.brand{
  padding:22px 20px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.brand h1{
  margin:0;
  font-size:24px;
}
.brand small{
  color:#c9ddc9;
}

.nav{
  padding:12px;
}
.nav button{
  width:100%;
  border:0;
  background:transparent;
  color:#dfeee0;
  text-align:left;
  padding:12px 14px;
  margin:2px 0;
  border-radius:9px;
  transition:.2s;
}
.nav button:hover,
.nav button.active{
  background:#2E7D32;
  color:white;
}

.main{
  margin-left:260px;
  width:calc(100% - 260px);
}

.topbar{
  height:70px;
  background:white;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  position:sticky;
  top:0;
  z-index:30;
}

.menu-btn{
  display:none;
  border:0;
  background:none;
  font-size:25px;
}

.admin-user{
  display:flex;
  align-items:center;
  gap:12px;
}
.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--green);
  color:white;
  display:grid;
  place-items:center;
  font-weight:bold;
}

.content{
  padding:22px;
}

.page-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}
.page-title h2{
  margin:0;
}

.cards{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:12px;
}
.card{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:17px;
  box-shadow:var(--shadow);
}
.card .label{
  color:var(--muted);
  font-size:12px;
}
.card .value{
  margin-top:8px;
  font-size:22px;
  font-weight:bold;
}
.green{color:var(--green)}
.red{color:var(--danger)}
.orange{color:var(--warning)}
.blue{color:var(--blue)}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  margin-top:18px;
}

.panel{
  background:white;
  border:1px solid var(--border);
  border-radius:13px;
  padding:18px;
  box-shadow:var(--shadow);
}
.panel h3{
  margin-top:0;
}

.stats-list{
  display:grid;
  gap:11px;
}
.stat-row{
  display:flex;
  justify-content:space-between;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.table-wrap{
  overflow:auto;
  background:white;
  border-radius:13px;
  border:1px solid var(--border);
  box-shadow:var(--shadow);
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:left;
  white-space:nowrap;
}
th{
  background:#f4f7f3;
  font-size:13px;
}
td{
  font-size:13px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:30px;
  font-size:11px;
  font-weight:bold;
}
.badge.green{background:#e5f5e6}
.badge.red{background:#fde8e8}
.badge.orange{background:#fff1df}
.badge.blue{background:#e8f1ff}
.badge.gray{background:#eef1f2}

.btn{
  border:0;
  padding:9px 13px;
  border-radius:8px;
  background:var(--green);
  color:white;
  font-weight:600;
}
.btn:hover{opacity:.9}
.btn.secondary{
  background:#eceff1;
  color:#263238;
}
.btn.danger{background:var(--danger)}
.btn.warning{background:var(--warning)}
.btn.blue{background:var(--blue)}
.btn.small{
  padding:6px 9px;
  font-size:11px;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
  margin-bottom:15px;
}
.input{
  border:1px solid #d5dadd;
  border-radius:8px;
  padding:10px;
  background:white;
  min-width:160px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:13px;
}
.form-group{
  display:grid;
  gap:6px;
}
.form-group.full{
  grid-column:1/-1;
}
.form-group label{
  font-size:12px;
  font-weight:bold;
}
.form-group input,
.form-group select,
.form-group textarea{
  border:1px solid #d5dadd;
  border-radius:8px;
  padding:10px;
}
.form-group textarea{
  min-height:90px;
  resize:vertical;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:100;
  padding:15px;
}
.modal.show{display:flex}
.modal-box{
  width:min(760px,100%);
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:15px;
  padding:20px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:15px;
}
.close{
  border:0;
  background:#eee;
  width:34px;
  height:34px;
  border-radius:50%;
}

.alert{
  padding:11px;
  border-radius:9px;
  margin-bottom:8px;
  font-size:13px;
}
.alert.warning{background:#fff4e5}
.alert.danger{background:#fdeaea}
.alert.info{background:#e9f2ff}
.alert.success{background:#e8f6e9}

.report{
  background:white;
  padding:35px;
  max-width:950px;
  margin:auto;
}
.report h1,.report h2{
  text-align:center;
}
.report-section{
  margin-top:25px;
}
.report-row{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #ddd;
  padding:8px 0;
}

.login{
  min-height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#173f1d,#2E7D32);
  padding:20px;
}
.login-box{
  width:min(420px,100%);
  background:white;
  border-radius:18px;
  padding:28px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}
.login-logo{
  text-align:center;
  margin-bottom:20px;
}
.login-logo h1{
  margin:0;
  color:var(--green);
}
.login-form{
  display:grid;
  gap:13px;
}
.login-form input{
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
}
.login-msg{
  font-size:13px;
  color:var(--danger);
  min-height:18px;
}

.hidden{display:none!important}

@media(max-width:1200px){
  .cards{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:800px){
  .sidebar{
    transform:translateX(-100%);
  }
  .sidebar.open{
    transform:translateX(0);
  }
  .main{
    margin-left:0;
    width:100%;
  }
  .menu-btn{display:block}
  .cards{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .content{padding:13px}
  .form-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .cards{grid-template-columns:1fr 1fr}
  .card{padding:12px}
  .card .value{font-size:18px}
  .topbar{padding:0 12px}
}

/* PRINT */
@media print{
  body{background:white}
  .sidebar,.topbar,.no-print,.modal{display:none!important}
  .main{
    margin:0;
    width:100%;
  }
  .content{padding:0}
  .report{
    max-width:none;
    padding:10px;
  }
}
</style>
</head>

<body>

</div>

<script>

    {id:"DP-003",name:"Steadfast",contact:"",area:"Bangladesh",charge:0,api:"Not Connected",active:false},

  ],

  payments:[],
  refunds:[],

};

function loadDB(){
  const raw = localStorage.getItem(DB_KEY);
  if(!raw){
    localStorage.setItem(DB_KEY,JSON.stringify(defaultDB));
    return structuredClone(defaultDB);
  }
  return JSON.parse(raw);
}

let db = loadDB();

// Backward compatibility for older localStorage data
if(typeof db.settings.fullPaymentEnabled !== "boolean") db.settings.fullPaymentEnabled=true;

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function uid(prefix){
  return prefix+"-"+Date.now().toString(36).toUpperCase();
}

function money(n){
  return "৳"+Number(n||0).toLocaleString("en-BD");
}

function esc(str){
  return String(str??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function logAction(action,module,targetId,result="Success"){
  db.audit.unshift({
    id:uid("LOG"),
    user:currentUser.email,
    role:currentUser.role,
    action,
    module,
    targetId:targetId||"-",
    time:new Date().toISOString(),
    result
  });
  saveDB();
}

function badge(status){
  let cls="gray";
  const s=String(status||"").toLowerCase();

  if(["delivered","verified","approved","completed","active"].includes(s)) cls="green";
  else if(["cancelled","rejected","refunded","inactive"].includes(s)) cls="red";
  else if(["pending","processing","packed","out for delivery"].includes(s)) cls="orange";
  else if(["confirmed","rider assigned","picked up"].includes(s)) cls="blue";

  return `<span class="badge ${cls}">${esc(status)}</span>`;
}

function openApp(){

/* =========================================================
   NAVIGATION
========================================================= */

function toggleSidebar(){

}

function showPage(page,btn=null){

  currentPage=page;

  document.querySelectorAll(".nav button")
    .forEach(b=>b.classList.remove("active"));

  if(btn) btn.classList.add("active");

  document.getElementById("pageHeading").textContent=

  const pages={
    dashboard:dashboardPage,
    orders:ordersPage,
    products:productsPage,

    categories:categoriesPage,
    customers:customersPage,
    riders:ridersPage,
    delivery:deliveryPage,
    payments:paymentsPage,

    cancellations:cancellationsPage,

    draw:drawPage,
    reviews:reviewsPage,

/* =========================================================
   DASHBOARD
========================================================= */

function orderTotal(o){
  const productTotal=o.products.reduce(
    (s,p)=>s+(Number(p.price)*Number(p.qty)),0
  );
  return productTotal+
    Number(o.deliveryCharge||0)+
    Number(o.platformCharge||0)-
    Number(o.discount||0);
}

function orderProductCost(o){
  return o.products.reduce(
    (s,p)=>s+(Number(p.cost||0)*Number(p.qty)),0
  );
}

function financials(){
  let sales=0;
  let delivery=0;
  let platform=0;
  let discount=0;
  let productCost=0;

  db.orders.forEach(o=>{
    if(o.status==="Cancelled" || o.status==="Returned") return;

    sales+=o.products.reduce(
      (s,p)=>s+Number(p.price)*Number(p.qty),0
    );

    delivery+=Number(o.deliveryCharge||0);
    platform+=Number(o.platformCharge||0);
    discount+=Number(o.discount||0);
    productCost+=orderProductCost(o);
  });

  const expenses=db.expenses.reduce(
    (s,e)=>s+Number(e.amount||0),0
  );

  const gross=sales-productCost-discount;
  const income=sales+delivery+platform-discount;
  const net=income-productCost-expenses;

  return {
    sales,delivery,platform,discount,
    productCost,expenses,gross,income,net
  };
}

function dashboardPage(){

  ].includes(o.status)).length;

    o=>o.status==="Cancelled"
  ).length;

  const lowStock=db.products.reduce(
    (n,p)=>n+p.variants.filter(v=>Number(v.stock)<=10).length,0
  );

  const pendingPayments=db.orders.filter(
    o=>o.paymentStatus==="Pending"
  ).length;

  return `
  <div class="page-title">
    <div>
      <h2>Business Dashboard</h2>
      <small>Nature bite — Admin Control Center</small>
    </div>
    <button class="btn" onclick="showPage('reports')">
      📈 Monthly Reports
    </button>
  </div>

  <div class="cards">

    ${dashboardCard("Total Sales",money(f.sales),"green")}
    ${dashboardCard("Total Orders",totalOrders,"blue")}
    ${dashboardCard("Delivered",delivered,"green")}

function dashboardCard(label,value,cls){

function filterOrders(search="",status=""){

  const q=String(search||"").toLowerCase();

  const list=db.orders.filter(o=>{

    const matchSearch=!q ||
      o.id.toLowerCase().includes(q) ||
      o.customer.toLowerCase().includes(q) ||
      o.mobile.toLowerCase().includes(q);

    const matchStatus=!status || o.status===status;

    return matchSearch && matchStatus;
  });

  document.getElementById("ordersTable").innerHTML=
    ordersTable(list);
}

function loadVariantsForOrder(){

  const pid=document.getElementById("newProduct")?.value;
  const box=document.getElementById("newVariant");

  if(!pid||!box)return;

  const p=db.products.find(x=>x.id===pid);

  box.innerHTML=p.variants.map(v=>
    `<option value="${v.id}">${esc(v.weight)} — ${money(v.price)}</option>`
  ).join("");
}

function createOrder(){

  const pid=document.getElementById("newProduct").value;
  const vid=document.getElementById("newVariant").value;

  const p=db.products.find(x=>x.id===pid);
  const v=p.variants.find(x=>x.id===vid);

  const order={
    id:uid("NB"),
    customer:document.getElementById("newCustomer").value,
    mobile:document.getElementById("newMobile").value,
    address:document.getElementById("newAddress").value,
    products:[
      {
        name:p.name,
        variant:v.weight,
        qty:Number(document.getElementById("newQty").value),
        price:v.price,
        cost:v.cost
      }
    ],
    deliveryCharge:Number(db.settings.deliveryCharge),
    platformCharge:Number(db.settings.platformCharge),
    discount:0,
    paymentMethod:document.getElementById("newPayment").value,
    paymentStatus:"Pending",
    senderNumber:"",
    transactionId:"",
    date:new Date().toISOString(),
    note:"",
    rider:"Not Assigned",
    status:"Pending"
  };

  db.orders.unshift(order);

  saveDB();
  logAction("Created Order","Orders",order.id);

  closeModal();
  showPage("orders");
}

function printAllLabels(){

  const checked=[
    ...document.querySelectorAll(".order-select:checked")
  ].map(x=>x.value);

function stockAdjustment(){

  openModal(
    "Stock Adjustment",
    `
    <div class="form-grid">

      <div class="form-group">
        <label>Product</label>
        <select id="stockProduct"
          onchange="loadStockVariants()">
          ${db.products.map(p=>
            `<option value="${p.id}">${esc(p.name)}</option>`
          ).join("")}
        </select>
      </div>

      <div class="form-group">
        <label>Variant</label>
        <select id="stockVariant"></select>
      </div>

      <div class="form-group">
        <label>Type</label>
        <select id="stockType">
          <option>Stock In</option>
          <option>Stock Out</option>
          <option>Adjustment</option>
        </select>
      </div>

      <div class="form-group">
        <label>Quantity</label>
        <input id="stockQty" type="number" min="0">
      </div>

      <div class="form-group full">
        <label>Note</label>
        <textarea id="stockNote"></textarea>
      </div>

    </div>

    <button class="btn" onclick="saveStockAdjustment()">
      Save Stock
    </button>
    `
  );

  setTimeout(loadStockVariants,50);
}

function loadStockVariants(){

  const pid=document.getElementById("stockProduct")?.value;
  const box=document.getElementById("stockVariant");

  if(!pid||!box)return;

  const p=db.products.find(x=>x.id===pid);

  box.innerHTML=p.variants.map(v=>
    `<option value="${v.id}">${esc(v.weight)}</option>`
  ).join("");
}

function saveStockAdjustment(){

  const p=db.products.find(
    x=>x.id===document.getElementById("stockProduct").value
  );

  const v=p.variants.find(
    x=>x.id===document.getElementById("stockVariant").value
  );

  const qty=Number(document.getElementById("stockQty").value||0);
  const type=document.getElementById("stockType").value;

  if(type==="Stock In") v.stock+=qty;
  if(type==="Stock Out") v.stock=Math.max(0,v.stock-qty);
  if(type==="Adjustment") v.stock=qty;

  saveDB();

  logAction(
    type,
    "Inventory",
    p.id+" / "+v.id
  );

  closeModal();
  showPage("inventory");
}

function toggleRider(id){
  const rider=db.riders.find(r=>r.id===id);
  if(!rider) return alert("Rider not found.");

  if(rider.active){
    const activeOrders=db.orders.filter(o=>
      o.rider===rider.name &&
      !["Delivered","Cancelled","Returned","Refunded"].includes(o.status)
    );
    if(activeOrders.length){
      const ok=confirm(
        `এই রাইডারের ${activeOrders.length}টি চলমান অর্ডার আছে। Inactive করলে নতুন অর্ডার পাবেন না, তবে চলমান অর্ডারগুলো থাকবে। চালিয়ে যাবেন?`
      );
      if(!ok) return;
    }else if(!confirm("এই রাইডারকে Inactive করবেন?")){
      return;
    }
    rider.active=false;
    rider.availability="Offline";
  }else{
    if(!confirm("এই রাইডারকে Active করবেন?")) return;
    rider.active=true;
  }

  saveDB();
  logAction(rider.active?"Activated Rider":"Deactivated Rider","Riders",rider.id);
  showPage("riders");
}

function verifyPayment(orderId,status){

  const o=db.orders.find(x=>x.id===orderId);

  if(o){
    o.paymentStatus=status;

    if(status==="Verified" && o.status==="Pending"){
      o.status="Confirmed";
    }

    saveDB();

    logAction(
      status==="Verified"?"Approved Payment":"Rejected Payment",
      "Payments",
      orderId
    );
  }

  showPage("payments");
}

   MONTHLY REPORTS
========================================================= */

function reportsPage(){

  const months=monthlyStatements();

  return `
  <div class="page-title">
    <div>
      <h2>📈 Reports & Monthly Statements</h2>
      <small>Sales, expenses and profit/loss</small>
    </div>

    <button class="btn" onclick="printCompleteReport()">
      🖨️ PRINT COMPLETE REPORT
    </button>
  </div>

  <div class="toolbar">

    <select id="reportMonth" class="input">
      ${months.map(m=>
        `<option value="${m.key}">${m.label}</option>`
      ).join("")}
    </select>

    <button class="btn secondary"
      onclick="viewMonthlyReport()">
      View Month
    </button>

  </div>

  <div id="monthlyReport">
    ${monthlyReportHTML(months[months.length-1]?.key)}
  </div>
  `;
}

function monthlyStatements(){

  const set=new Set();

  db.orders.forEach(o=>{
    set.add(new Date(o.date).toISOString().slice(0,7));
  });

  db.expenses.forEach(e=>{
    set.add(String(e.date).slice(0,7));
  });

  const now=new Date();
  set.add(now.toISOString().slice(0,7));

  return [...set].sort().map(key=>{

    const [y,m]=key.split("-");

    const date=new Date(Number(y),Number(m)-1,1);

    return {
      key,
      label:date.toLocaleString("en-US",{
        month:"long",
        year:"numeric"
      })
    };
  });
}

function monthlyData(key){

  const orders=db.orders.filter(o=>
    String(o.date).slice(0,7)===key
  );

  const expenses=db.expenses.filter(e=>
    String(e.date).slice(0,7)===key
  );

  let productSales=0;
  let deliveryIncome=0;
  let platformIncome=0;
  let discount=0;
  let productCost=0;

  orders.forEach(o=>{

    if(["Cancelled","Returned"].includes(o.status))return;

    productSales+=o.products.reduce(
      (s,p)=>s+Number(p.price)*Number(p.qty),0
    );

    deliveryIncome+=Number(o.deliveryCharge||0);
    platformIncome+=Number(o.platformCharge||0);
    discount+=Number(o.discount||0);
    productCost+=orderProductCost(o);
  });

  const expenseTotal=expenses.reduce(
    (s,e)=>s+Number(e.amount||0),0
  );

  const totalIncome=
    productSales+
    deliveryIncome+
    platformIncome-
    discount;

  const grossProfit=
    productSales-
    discount-
    productCost;

  const net=
    totalIncome-
    productCost-
    expenseTotal;

  return {
    orders,
    expenses,
    productSales,
    deliveryIncome,
    platformIncome,
    discount,
    productCost,
    expenseTotal,
    totalIncome,
    grossProfit,
    net
  };
}

function monthlyReportHTML(key){

  if(!key){
    return `<div class="panel">No report data.</div>`;
  }

  const [year,month]=key.split("-");

  const date=new Date(Number(year),Number(month)-1,1);

  const label=date.toLocaleString("en-US",{
    month:"long",
    year:"numeric"
  });

  const d=monthlyData(key);

  const delivered=d.orders.filter(
    o=>o.status==="Delivered"
  ).length;

  const cancelled=d.orders.filter(
    o=>o.status==="Cancelled"
  ).length;

  const refunded=d.orders.filter(
    o=>o.status==="Refunded"
  ).length;

  return `
  <div class="report" id="reportPrintArea">

    <h1>NATURE BITE</h1>
    <h2>Monthly Business Report</h2>

    <p style="text-align:center">
      <strong>${label}</strong>
    </p>

    <div class="report-section">
      <h3>SALES SUMMARY</h3>
      ${reportRow("Total Product Sales",money(d.productSales))}
      ${reportRow("Total Orders",d.orders.length)}
      ${reportRow("Delivered Orders",delivered)}
      ${reportRow("Cancelled Orders",cancelled)}
      ${reportRow("Refunded Orders",refunded)}
    </div>

    <div class="report-section">
      <h3>INCOME</h3>
      ${reportRow("Product Sales",money(d.productSales))}
      ${reportRow("Delivery Income",money(d.deliveryIncome))}
      ${reportRow("Platform Income",money(d.platformIncome))}
      ${reportRow("Discount",money(d.discount))}
      ${reportRow("Total Income",money(d.totalIncome))}
    </div>

    <div class="report-section">
      <h3>EXPENSES</h3>
      ${reportRow("Product / Purchase Cost",money(d.productCost))}

      ${reportExpenseRows(d.expenses)}

      ${reportRow("Total Operating Expenses",money(d.expenseTotal))}
    </div>

    <div class="report-section">
      <h3>FINANCIAL SUMMARY</h3>
      ${reportRow("Gross Profit",money(d.grossProfit))}
      ${reportRow("Net Profit / Loss",money(d.net))}
    </div>

    <div class="report-section">
      <h3>PAYMENT SUMMARY</h3>
      ${reportRow("bKash",
        money(d.orders.filter(o=>o.paymentMethod==="bKash")
        .reduce((s,o)=>s+orderTotal(o),0)))}

      ${reportRow("Nagad",
        money(d.orders.filter(o=>o.paymentMethod==="Nagad")
        .reduce((s,o)=>s+orderTotal(o),0)))}

      ${reportRow("COD",
        money(d.orders.filter(o=>o.paymentMethod==="Cash on Delivery")
        .reduce((s,o)=>s+orderTotal(o),0)))}
    </div>

    <div class="report-section">
      <h3>DELIVERY SUMMARY</h3>

      ${reportRow(
        "Nature Bite Delivery",
        d.orders.filter(o=>o.rider&&o.rider!=="Not Assigned").length
      )}

      ${reportRow("Pathao","Manual/API pending")}
      ${reportRow("Steadfast","Manual/API pending")}
      ${reportRow("CarryBee","Manual/API pending")}
    </div>

    <div class="report-section">
      <h3>INVENTORY SUMMARY</h3>

      ${reportRow(
        "Current Inventory Valuation",
        money(
          db.products.reduce(
            (s,p)=>s+p.variants.reduce(
              (x,v)=>x+(Number(v.stock)*Number(v.cost||0)),0
            ),0
          )
        )
      )}

      ${reportRow(
        "Low Stock Variants",
        db.products.reduce(
          (s,p)=>s+p.variants.filter(
            v=>Number(v.stock)<=Number(v.threshold||10)
          ).length,0
        )
      )}
    </div>

    <div class="report-section">
      <h3>CUSTOMER SUMMARY</h3>
      ${reportRow("New Customers","Firebase data pending")}
      ${reportRow("Returning Customers","Firebase data pending")}
    </div>

    <hr>

    <p style="text-align:center;font-size:11px">
      Generated by Nature bite Admin<br>
      ${new Date().toLocaleString()}
    </p>

  </div>
  `;
}

function reportRow(a,b){
  return `<div class="report-row">
    <span>${a}</span>
    <strong>${b}</strong>
  </div>`;
}

function reportExpenseRows(list){

  const cats={};

  list.forEach(e=>{
    cats[e.category]=(cats[e.category]||0)+Number(e.amount||0);
  });

  return Object.entries(cats)
    .map(([k,v])=>reportRow(k,money(v)))
    .join("");
}

function viewMonthlyReport(){

  const key=document.getElementById("reportMonth").value;

  document.getElementById("monthlyReport").innerHTML=
    monthlyReportHTML(key);
}

function printCompleteReport(){

  const key=document.getElementById("reportMonth")?.value ||
    new Date().toISOString().slice(0,7);

  const html=monthlyReportHTML(key);

  const win=window.open("","_blank");

  win.document.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <title>Nature bite Monthly Report</title>
      <style>
        body{font-family:Arial;margin:30px}
        .report{max-width:900px;margin:auto}
        .report h1,.report h2{text-align:center}
        .report-section{margin-top:25px}
        .report-row{
          display:flex;
          justify-content:space-between;
          padding:8px 0;
          border-bottom:1px solid #ddd
        }
      </style>
    </head>
    <body onload="window.print()">
      ${html}
    </body>
    </html>
  `);

  win.document.close();

  logAction("Printed Monthly Report","Reports",key);
}

        <textarea id="chNote"></textarea>

function saveChalan(){

  const qty=Number(document.getElementById("chQty").value||0);
  const price=Number(document.getElementById("chPrice").value||0);

  const c={
    id:uid("CHALAN"),
    number:document.getElementById("chNumber").value,
    party:document.getElementById("chParty").value,
    product:document.getElementById("chProduct").value,
    variant:document.getElementById("chVariant").value,
    quantity:qty,
    unitPrice:price,
    total:qty*price,
    transport:document.getElementById("chTransport").value,
    note:document.getElementById("chNote").value,
    createdBy:currentUser.email,
    createdAt:new Date().toISOString(),
    status:"Pending Approval",
    history:[
      {
        action:"Created",
        by:currentUser.email,
        time:new Date().toISOString()
      },
      {
        action:"Submitted for Approval",
        by:currentUser.email,
        time:new Date().toISOString()
      }
    ]
  };

  db.chalans.unshift(c);

  db.notifications.unshift({
    id:uid("NOT"),
    type:"Chalan Approval",
    title:"New Chalan Approval Request",
    message:`${c.number} — ${money(c.total)}`,
    date:new Date().toISOString(),
    read:false
  });

  saveDB();

  logAction("Submitted Chalan","Chalan",c.id);

  closeModal();
  showPage("chalan");
}

function approveChalan(id){

  const c=db.chalans.find(x=>x.id===id);
  if(!c)return;

  c.status="Approved";

  c.history.push({
    action:"Approved",
    by:currentUser.email,
    time:new Date().toISOString()
  });

  saveDB();

  logAction("Approved Chalan","Chalan",id);

  showPage("chalan");
}

function rejectChalan(id){

  const reason=prompt("Reject reason:");

  if(reason===null)return;

  const c=db.chalans.find(x=>x.id===id);
  if(!c)return;

  c.status="Rejected";
  c.rejectReason=reason;

  c.history.push({
    action:"Rejected",
    reason,
    by:currentUser.email,
    time:new Date().toISOString()
  });

  saveDB();

  logAction("Rejected Chalan","Chalan",id);

  showPage("chalan");
}

function printChalan(id){

  const c=db.chalans.find(x=>x.id===id);

  if(!c || c.status!=="Approved"){
    alert("Chalan must be Approved before printing.");
    return;
  }

  const win=window.open("","_blank");

  win.document.write(`
  <html>
  <head>
    <title>${esc(c.number)}</title>
    <style>
      body{font-family:Arial;padding:30px}
      .box{max-width:800px;margin:auto}
      table{width:100%;border-collapse:collapse}
      td,th{border:1px solid #ddd;padding:10px}
      h1,h2{text-align:center}
    </style>
  </head>
  <body onload="window.print()">
    <div class="box">
      <h1>NATURE BITE</h1>
      <h2>CHALAN</h2>

      <p>
        Chalan No: <strong>${esc(c.number)}</strong><br>
        Date: ${new Date(c.createdAt).toLocaleString()}<br>
        Created By: ${esc(c.createdBy)}<br>
        Approved By: ${esc(currentUser.email)}
      </p>

      <table>
        <tr>
          <th>Product</th>
          <th>Variant</th>
          <th>Quantity</th>
          <th>Unit Price</th>
          <th>Total</th>
        </tr>

        <tr>
          <td>${esc(c.product)}</td>
          <td>${esc(c.variant)}</td>
          <td>${c.quantity}</td>
          <td>${money(c.unitPrice)}</td>
          <td>${money(c.total)}</td>
        </tr>
      </table>

      <h3 style="text-align:right">
        Grand Total: ${money(c.total)}
      </h3>

      <p style="text-align:center">
        <strong>APPROVED</strong>
      </p>

    </div>
  </body>
  </html>
  `);

  win.document.close();

  c.history.push({
    action:"Printed",
    by:currentUser.email,
    time:new Date().toISOString()
  });

  saveDB();

  logAction("Printed Chalan","Chalan",id);
}

function permissionForm(role){

  const saved=db.staff.find(s=>s.role===role)?.permissions||{};

  openModal(
    "Permissions — "+role,
    `
    <div style="overflow:auto">

    <table style="min-width:700px">
      <thead>
        <tr>
          <th>Module</th>
          ${actions.map(a=>`<th>${a}</th>`).join("")}
        </tr>
      </thead>

      <tbody>

      ${modules.map(m=>`
        <tr>
          <td><strong>${m}</strong></td>

          ${actions.map(a=>{
            const key=m+"_"+a;
            const checked=role==="Super Admin"
              ? true
              : Boolean(saved[key]);

            return `
              <td>
                <input
                  type="checkbox"
                  class="perm"
                  data-key="${esc(key)}"
                  ${checked?"checked":""}
                  ${role==="Super Admin"?"disabled":""}>
              </td>
            `;
          }).join("")}

        </tr>
      `).join("")}

      </tbody>
    </table>

    </div>

    <button class="btn" style="margin-top:15px"
      onclick="savePermissions('${esc(role)}')">
      Save Permissions
    </button>
    `
  );
}

function savePermissions(role){

  if(role==="Super Admin"){
    closeModal();
    return;
  }

  const permissions={};

  document.querySelectorAll(".perm").forEach(x=>{
    permissions[x.dataset.key]=x.checked;
  });

  db.staff
    .filter(s=>s.role===role)
    .forEach(s=>{
      s.permissions=permissions;
    });

  saveDB();

  logAction(
    "Changed Permissions",
    "Staff",
    role
  );

  closeModal();
  showPage("staff");
}

function simpleTable(headers,rows){

  return `
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          ${headers.map(h=>`<th>${h}</th>`).join("")}
        </tr>
      </thead>

      <tbody>

        ${rows.length
          ? rows.map(r=>`
              <tr>
                ${r.map(c=>`<td>${c}</td>`).join("")}
              </tr>
            `).join("")
          : `<tr>
              <td colspan="${headers.length}">
                No records yet.
              </td>
             </tr>`
        }

      </tbody>
    </table>
  </div>
  `;
}

function openModal(title,body){

  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=body;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}
